name: TEMP normalize theme bootstrap

on:
  push:
    branches: [fix/theme-first-paint-loading]
    paths:
      - '.github/workflows/tmp-normalize-theme-bootstrap.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/theme-first-paint-loading
      - name: Normalize bootstrap formatting
        run: python .github/scripts/tmp_normalize_theme_bootstrap.py
      - name: Validate markup
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '\\n<!-- Apply the saved appearance' not in s
          assert s.count('id="rt-theme-first-paint"') == 1
          assert s.index('id="rt-theme-first-paint"') < s.index('href="./app.css?v=')
          print('theme bootstrap formatting gate passed')
          PY
      - name: Commit production-only result and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-normalize-theme-bootstrap.yml .github/scripts/tmp_normalize_theme_bootstrap.py
          git add index.html
          git commit -m "chore(ui): normalize first-paint bootstrap markup"
          git push origin HEAD:fix/theme-first-paint-loading
