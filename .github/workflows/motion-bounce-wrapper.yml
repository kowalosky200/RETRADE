name: RETRADE visible donut bounce

on:
  push:
    branches:
      - fix/motion-v1-7-bounce-wrapper

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motion-v1-7-bounce-wrapper
          fetch-depth: 0

      - name: Move donut bounce to HTML wrapper
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''@keyframes rtDonutFinishBounce{\n  0%{transform:scale(1);}\n  30%{transform:scale(1.045);}\n  55%{transform:scale(.988);}\n  78%{transform:scale(1.012);}\n  100%{transform:scale(1);}\n}\n#p-summary svg.cat-donut-svg.cat-donut-draw{\n  transform-box:fill-box;\n  transform-origin:center;\n  will-change:transform;\n  animation:rtDonutFinishBounce 360ms cubic-bezier(.2,.8,.2,1) 760ms both;\n}'''

          new = '''@keyframes rtDonutFinishBounce{\n  0%{transform:scale(1);}\n  24%{transform:scale(1.075);}\n  48%{transform:scale(.965);}\n  72%{transform:scale(1.028);}\n  88%{transform:scale(.992);}\n  100%{transform:scale(1);}\n}\n/* Animate the ordinary HTML wrapper, not the root SVG. Root-SVG transforms can\n   be swallowed/flattened by Safari while its child stroke animations are active.\n   The wrapper is compositor-driven and makes the landing bounce consistently visible. */\n#p-summary .cat-donut-chart:has(svg.cat-donut-draw){\n  transform-origin:50% 50%;\n  will-change:transform;\n  animation:rtDonutFinishBounce 480ms cubic-bezier(.22,.72,.2,1) 790ms both;\n}'''

          if old not in s:
              raise SystemExit('existing donut bounce block not found')
          s = s.replace(old, new, 1)

          s = s.replace('  #p-summary svg.cat-donut-svg.cat-donut-draw{transform:none!important;}\n',
                        '  #p-summary .cat-donut-chart:has(svg.cat-donut-draw){transform:none!important;}\n', 1)
          s = s.replace('  #p-summary svg.cat-donut-svg.cat-donut-draw{\n    animation:none!important;animation-delay:0ms!important;\n  }',
                        '  #p-summary .cat-donut-chart:has(svg.cat-donut-draw){\n    animation:none!important;animation-delay:0ms!important;\n  }', 1)

          # The reduce selector is part of a comma-list in this file, so replace that
          # exact selector independently as well.
          s = s.replace('  #p-summary svg.cat-donut-svg.cat-donut-draw{\n',
                        '  #p-summary .cat-donut-chart:has(svg.cat-donut-draw){\n')

          if '#p-summary .cat-donut-chart:has(svg.cat-donut-draw)' not in s:
              raise SystemExit('wrapper bounce selector missing')
          if 'scale(1.075)' not in s:
              raise SystemExit('visible bounce amplitude missing')

          p.write_text(s, encoding='utf-8', newline='')

      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'cat-donut-chart:has(svg.cat-donut-draw)' index.html
          grep -q 'scale(1.075)' index.html
          grep -q 'rtDonutFinishBounce 480ms' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/motion-bounce-wrapper.yml
          git add index.html
          git commit -m "fix(motion): make category bounce visible across browsers"
          git push origin HEAD:fix/motion-v1-7-bounce-wrapper
