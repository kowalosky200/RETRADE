name: Compare prior chart motion
on:
  push:
    branches: [audit/performance-v1-4-36]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/performance-v1-4-36
          fetch-depth: 0
      - name: Compare current and prior motion implementations
        run: |
          git fetch origin fix/motion-v1-7 fix/motion-v1-7-tail-bounce ui/dashboard-area-motion-v1-4-32 --depth=1 || true
          for ref in audit/performance-v1-4-36 origin/fix/motion-v1-7 origin/fix/motion-v1-7-tail-bounce origin/ui/dashboard-area-motion-v1-4-32; do
            echo "========== $ref CSS =========="
            git show "$ref:app.css" 2>/dev/null | grep -n -B 20 -A 55 "rtChartPartial\|partial-dash\|chart.*dash" | tail -220 || true
            echo "========== $ref JS =========="
            git show "$ref:app.js" 2>/dev/null | grep -n -B 35 -A 90 "_mkDashMarks\|partialLast\|dash-delay" | head -360 || true
          done
