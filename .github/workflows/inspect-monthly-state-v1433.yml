name: Apply v1.4.33 monthly and dashboard patch
on:
  push:
    branches: [ui/monthly-dashboard-accounting-v1-4-33]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/monthly-dashboard-accounting-v1-4-33
          fetch-depth: 0
      - name: Apply v1.4.33 patch
        run: python3 scripts/apply_monthly_dashboard_v1433.py
      - name: JavaScript syntax check
        run: node --check app.js && node --check accounting.js && node --check reports.js
      - name: Patch integrity check
        run: |
          git diff --check
          grep -q "const _bootMonthlyRoute" app.js
          grep -q "Gross revenue" app.js
          grep -q "Profit breakdown" app.js
          grep -q "const refundCycles=new Map" accounting.js
          grep -q "function calcSummaryGrossStats" accounting.js
          grep -q "app.js?v=1.4.33" index.html
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css accounting.js index.html
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Stabilise Sales routing and clarify gross vs net reporting"
          git push origin HEAD:ui/monthly-dashboard-accounting-v1-4-33
