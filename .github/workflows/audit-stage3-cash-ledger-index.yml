name: Stage 3 cash and ledger index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-cash-ledger-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settlement and cash reconciliation blocks
        shell: bash
        run: |
          echo '=== SETTLEMENT CONFIRM 9360-9550 ==='
          sed -n '9360,9550p' app.js
          echo
          echo '=== BULK UNSETTLE / LEGACY SETTLE 9635-9775 ==='
          sed -n '9635,9775p' app.js
          echo
          echo '=== SETTLE ALL / ITEM TOGGLE 10120-10335 ==='
          sed -n '10120,10335p' app.js
          echo
          echo '=== SETTLE TOGGLE CALL SITES ==='
          grep -n "_acctBulkUnsettle\|settleAllForAccount\|toggleItemSettled" app.js || true
          echo
          echo '=== CASH SYSTEM MIRRORS 17230-17315 ==='
          sed -n '17230,17315p' app.js
          echo
          echo '=== SYSTEM MIRROR RECONCILIATION 23615-23765 ==='
          sed -n '23615,23765p' app.js
          echo
          echo '=== MIRROR RECONCILIATION CALL SITES ==='
          grep -n "_backfillSystemCashEvents\|_v14ReconcileSystemCashEvents" app.js || true
          echo
          echo '=== AUTHORITATIVE CASH EVENTS accounting.js 70-255 ==='
          sed -n '70,255p' accounting.js
          echo
          echo '=== CASH REGRESSION 1845-1950 ==='
          sed -n '1845,1950p' accounting.js
