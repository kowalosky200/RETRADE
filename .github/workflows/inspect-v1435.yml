name: Apply v1.4.35 chart and Sales route polish
on:
  push:
    branches: [ui/chart-routing-polish-v1-4-35]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/chart-routing-polish-v1-4-35
          fetch-depth: 0
      - name: Apply v1.4.35 patch
        run: python3 scripts/apply_chart_routing_v1435.py
      - name: JavaScript syntax check
        run: node --check app.js && node --check accounting.js && node --check reports.js
      - name: Patch integrity check
        run: |
          git diff --check
          grep -q "fill-opacity=\\\"'+(isPartial?'0.12':'0.82')" app.js
          grep -q "Refunds</span>" app.js
          grep -q "tertiaryLabel+(tertiaryCounts" app.js
          grep -q "MONTHLY_VIEW==='grid')delete _chartDrawKey\['monthly-profitability-svg'\]" app.js
          grep -q "delete _chartDrawKey\['summary-chart-svg'\]" app.js
          grep -q "monthly-legend-refund-line{display:inline-block;width:12px;height:0;border-top:2px solid var(--red)" app.css
          grep -q "app.js?v=1.4.35" index.html
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Polish chart legends bars motion and Sales route persistence"
          git push origin HEAD:ui/chart-routing-polish-v1-4-35
