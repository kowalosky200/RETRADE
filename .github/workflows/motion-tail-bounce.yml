name: RETRADE motion tail and bounce

on:
  push:
    branches:
      - fix/motion-v1-7-tail-bounce

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/motion-v1-7-tail-bounce
          fetch-depth: 0

      - name: Patch motion
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="rt-chart-current-period-motion">'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('motion style block not found')
          end = s.find('</style>', start)
          if end < 0:
              raise SystemExit('motion style closing tag not found')
          end += len('</style>')

          block = '''<style id="rt-chart-current-period-motion">
/* v1.7.1 motion pass — preserve the smooth history draw, then let the live
   dotted tail creep in without a visibility/clip interpolation snap. */
@keyframes rtChartCurrentTailReveal{
  0%{visibility:hidden;clip-path:inset(0 100% 0 0);}
  .001%{visibility:visible;clip-path:inset(0 100% 0 0);}
  100%{visibility:visible;clip-path:inset(0 0 0 0);}
}
@keyframes rtChartCurrentLabelIn{
  0%{opacity:0;transform:translateY(2px);}
  100%{opacity:.85;transform:translateY(0);}
}
#p-summary svg.rt-motion-hold .rt-chart-partial,
#p-summary svg.rt-motion-hold:has(.rt-chart-partial)>text:last-of-type{
  visibility:hidden!important;opacity:0!important;animation:none!important;
}
#p-summary svg.rt-chart-draw .rt-chart-partial{
  visibility:hidden;
  stroke-dashoffset:0!important;
  transform-box:fill-box;
  will-change:clip-path;
  animation:rtChartCurrentTailReveal 720ms linear var(--dur-draw) both;
}
#p-summary svg.rt-chart-draw:has(.rt-chart-partial)>text:last-of-type{
  opacity:0;transform-box:fill-box;transform-origin:center;
  animation:rtChartCurrentLabelIn 180ms var(--ease-out) calc(var(--dur-draw) + 520ms) both;
}

/* Keep the ring as one continuous sweep, then add the missing bounce on the
   SVG as a compositor transform. This gives a visible elastic finish without
   reopening/retracting stroke geometry (the old source of the end stutter). */
#p-summary svg.cat-donut-draw{--dur-donut-sweep:840ms;}
#p-summary svg.cat-donut-draw circle.donut-seg-last{
  animation:donutSweep calc(var(--seg-t) * var(--dur-donut-sweep)) cubic-bezier(.35,.35,.72,1) calc(var(--seg-t0) * var(--dur-donut-sweep)) both;
}
@keyframes rtDonutFinishBounce{
  0%{transform:scale(1);}
  30%{transform:scale(1.045);}
  55%{transform:scale(.988);}
  78%{transform:scale(1.012);}
  100%{transform:scale(1);}
}
#p-summary svg.cat-donut-svg.cat-donut-draw{
  transform-box:fill-box;
  transform-origin:center;
  will-change:transform;
  animation:rtDonutFinishBounce 360ms cubic-bezier(.2,.8,.2,1) 760ms both;
}

@media(prefers-reduced-motion:reduce){
  #p-summary svg.rt-chart-draw .rt-chart-partial,
  #p-summary svg.rt-chart-draw:has(.rt-chart-partial)>text:last-of-type,
  #p-summary svg.cat-donut-draw circle,
  #p-summary svg.cat-donut-draw circle.donut-seg-last,
  #p-summary svg.cat-donut-svg.cat-donut-draw{
    animation:none!important;animation-delay:0ms!important;
  }
  #p-summary svg.rt-chart-draw .rt-chart-partial{
    visibility:visible!important;clip-path:inset(0 0 0 0)!important;stroke-dashoffset:0!important;
  }
  #p-summary svg.rt-chart-draw:has(.rt-chart-partial)>text:last-of-type{
    opacity:.85!important;transform:none!important;
  }
  #p-summary svg.cat-donut-svg.cat-donut-draw{transform:none!important;}
}
</style>'''

          updated = s[:start] + block + s[end:]
          if updated.count(marker) != 1:
              raise SystemExit('unexpected motion block count')
          if '.001%{visibility:visible;clip-path:inset(0 100% 0 0);}' not in updated:
              raise SystemExit('tail anti-snap keyframe missing')
          if 'rtDonutFinishBounce' not in updated:
              raise SystemExit('donut bounce missing')
          p.write_text(updated, encoding='utf-8', newline='')

      - name: Validate and commit
        run: |
          git diff --check
          grep -q 'rtChartCurrentTailReveal 720ms linear' index.html
          grep -q 'rtDonutFinishBounce 360ms' index.html
          test "$(grep -c 'id="rt-chart-current-period-motion"' index.html)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/motion-tail-bounce.yml
          git add index.html
          git commit -m "fix(motion): creep live tail and restore donut bounce"
          git push origin HEAD:fix/motion-v1-7-tail-bounce
