name: dashboard-sales-returns-main
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dashboard patch
        shell: bash
        run: |
          python .github/dashboard_sales_returns_patch.py
          node --check app.js
          git diff --check
          grep -q "chartReturns" app.js
          grep -q "tertiaryLabel:'Refunds'" app.js
          grep -q "Sales &amp; returns over time" app.js
          git rm .github/dashboard_sales_returns_patch.py .github/workflows/dashboard-sales-returns-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix(dashboard): separate sales profit and refunds"
          git push origin HEAD:main
