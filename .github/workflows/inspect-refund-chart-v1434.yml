name: Apply v1.4.34 chart polish
on:
  push:
    branches: [ui/refund-chart-polish-v1-4-34]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/refund-chart-polish-v1-4-34
          fetch-depth: 0
      - name: Apply v1.4.34 patch
        run: python3 scripts/apply_refund_chart_v1434.py
      - name: JavaScript syntax check
        run: node --check app.js && node --check accounting.js && node --check reports.js
      - name: Patch integrity check
        run: |
          git diff --check
          grep -q "fillData:profitData,fillColor:'var(--profit)',fillOpacity:0.50" app.js
          grep -q "Refunds ('+chartReturnCounts.reduce" app.js
          grep -q "monthly-legend-refund-line" app.js
          grep -q "tertiaryLineOpacity:0.58" app.js
          grep -q "tertiaryEvents:false" app.js
          grep -q "tertiaryEventY=H-pad.b-Math.max" app.js
          grep -q "app.js?v=1.4.34" index.html
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Refine dashboard profit fill and refund chart hierarchy"
          git push origin HEAD:ui/refund-chart-polish-v1-4-34
