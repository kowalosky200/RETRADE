name: Inspect sale one variables
on:
  push:
    branches: [audit/return-profit-bounce]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/return-profit-bounce
      - run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('app.js').read_text(encoding='utf-8').splitlines()
          a,b=6140,6222
          Path('docs/sale1-vars-context.txt').write_text('\n'.join(f'{i+1}: {lines[i]}' for i in range(a-1,min(b,len(lines)))),encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-sale1-vars.yml
          git add docs/sale1-vars-context.txt
          git commit -m "chore: capture sale one variables"
          git push origin HEAD:audit/return-profit-bounce
