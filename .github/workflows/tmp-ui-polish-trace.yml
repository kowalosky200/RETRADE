name: TEMP UI polish trace

on: [push]

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace final patch anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')

          for label,needle,length in [
            ('donut function','function buildCategoryDonut',9000),
            ('extended load state','const _rtBaseLoadUIState',5000),
            ('init before loader','const _freshSession = !_isSameSession();',3300),
            ('cashflow manager','let _cashflowSearch=',14500),
          ]:
            i=app.find(needle)
            print('\n===== '+label+' =====')
            print('NOT FOUND' if i<0 else app[i:i+length])

          for label,needle,length in [
            ('motion tokens','--dur-bounce:',1800),
            ('donut motion','@keyframes donutSweep',6000),
          ]:
            i=css.find(needle)
            print('\n===== '+label+' =====')
            print('NOT FOUND' if i<0 else css[i:i+length])
          PY
