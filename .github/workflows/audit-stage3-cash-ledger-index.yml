name: Stage 3 cash and ledger index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-cash-ledger-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settlement migration and account anchors
        shell: bash
        run: |
          echo '=== MIGRATION CALL SITES ==='
          grep -n "_migrateSupplierSettledOnce" app.js || true
          echo
          echo '=== INIT AROUND CALLS ==='
          grep -n -B12 -A18 "_migrateSupplierSettledOnce" app.js || true
          echo
          echo '=== ACCOUNT ASSIGN HELPER 11075-11125 ==='
          sed -n '11075,11125p' app.js
          echo
          echo '=== ACCOUNT EDIT/DELETE 10425-10480 ==='
          sed -n '10425,10480p' app.js
          echo
          echo '=== SAVE STOCK EDIT 20335-20385 ==='
          sed -n '20335,20385p' app.js
          echo
          echo '=== PANEL QUICK EDIT 20385-20425 ==='
          sed -n '20385,20425p' app.js
