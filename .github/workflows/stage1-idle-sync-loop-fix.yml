name: Stage 1 idle sync loop fix

on:
  push:
    paths:
      - '.github/workflows/stage1-idle-sync-loop-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch idle sync loop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          marker = 'await _backfillDateSoldAtReturn();'
          call_true = '_repairRunLinkedDates(true);'
          call_false = '_repairRunLinkedDates(false);'
          marker_pos = text.find(marker)
          if marker_pos < 0:
              raise SystemExit('Cloud-load anchor not found')
          call_pos = text.find(call_true, marker_pos)
          if call_pos < 0 or call_pos - marker_pos > 500:
              raise SystemExit('Expected linked-date repair call not found near cloud-load anchor')
          text = text[:call_pos] + call_false + text[call_pos + len(call_true):]
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_ver = './app.js?v=1.4.11'
          new_ver = './app.js?v=1.4.12'
          if html.count(old_ver) != 1:
              raise SystemExit(f'Expected exactly one {old_ver} reference, found {html.count(old_ver)}')
          index.write_text(html.replace(old_ver, new_ver, 1), encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check app.js

      - name: Verify targeted change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text(encoding='utf-8')
          marker = 'await _backfillDateSoldAtReturn();'
          p = text.find(marker)
          segment = text[p:p+500]
          if '_repairRunLinkedDates(false);' not in segment:
              raise SystemExit('Targeted cloud-load repair is not read-only')
          html = Path('index.html').read_text(encoding='utf-8')
          if './app.js?v=1.4.12' not in html:
              raise SystemExit('v1.4.12 cache-busting reference missing')
          print('Stage 1 idle-sync fix verified')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "RETRADE Audit"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(sync): stop cloud reads creating idle outbox writes"
          git push
