name: TEMP Stage 3 lifecycle hardening v2

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/tmp-stage3-lifecycle-hardening-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lifecycle integrity guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          def sub1(pattern,repl,label,flags=re.S):
              global s
              s2,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s=s2

          lifecycle_anchor="""function _lifecycleCan(i,action){
            const s=_itemLifecycleState(i);
            if(action==='list')return s==='sourced';
            if(action==='markSold')return s==='listed';
            if(action==='return')return s==='sold';
            if(action==='relist')return s==='returned';
            if(action==='moveUnlisted')return s==='returned';
            return false;
          }
          """
          if lifecycle_anchor not in s: raise SystemExit('lifecycle helper anchor not found')
          s=s.replace(lifecycle_anchor,lifecycle_anchor+"""
          // Stage 3 lifecycle integrity — mutation helpers. UI visibility is not a
          // data-integrity boundary: destructive shortcuts re-check these at commit.
          function _itemHasPriorFullReturn(i){
            return !!(i&&Array.isArray(i.returnHistory)&&i.returnHistory.some(function(r){return r&&(r.type==='full_seller'||r.type==='full_ebay');}));
          }
          function _itemGroupedSaleIds(i){
            const ids=new Set();if(!i)return [];
            if(i.bundleId)ids.add(i.bundleId);if(i.resaleBundleId)ids.add(i.resaleBundleId);
            (Array.isArray(i.returnHistory)?i.returnHistory:[]).forEach(function(r){if(r&&r._bundleIdAtReturn)ids.add(r._bundleIdAtReturn);});
            return Array.from(ids);
          }
          function _itemHasGroupedSale(i){return _itemGroupedSaleIds(i).length>0;}
          """,1)

          sub1(
            r"async function bulkAction\(action\)\{\n  if\(action==='sold'\)\{.*?\n  \}else if\(action==='delete'\)\{",
            """async function bulkAction(action){
            if(action==='sold'){
              const today=new Date().toISOString().split('T')[0];
              let changed=0,relistedSkipped=0,protectedSkipped=0,invalidSkipped=0;
              SELECTED_ITEMS.forEach(function(id){
                const rec=_findItemRecordById(id),item=rec&&rec.item;
                if(!item){invalidSkipped++;return;}
                if(_activeJobLotMembership(id)){protectedSkipped++;return;}
                if(!_lifecycleCan(item,'markSold')){invalidSkipped++;return;}
                if(_itemHasPriorFullReturn(item)){relistedSkipped++;return;}
                item.dateSold=today;item.isReturned=false;item.state='sold';
                if(!item.soldOnPlatform)item.soldOnPlatform=_itemPlatform(item);
                item.grossProfit=calcGrossProfit(item);changed++;
              });
              if(!changed){
                const msg=relistedSkipped?'Relisted items must be sold individually so Sale 2+ is recorded correctly':protectedSkipped?'Selected item is managed through a Job Lot':'No selected listed items can be sold';
                toast(msg,'err');return;
              }
              saveDB();SELECTED_ITEMS.clear();SELECTION_MODE=false;
              let msg='Marked '+changed+' item'+(changed===1?'':'s')+' as sold';
              if(relistedSkipped)msg+=' · skipped '+relistedSkipped+' relisted item'+(relistedSkipped===1?'':'s');
              if(protectedSkipped)msg+=' · skipped '+protectedSkipped+' Job Lot item'+(protectedSkipped===1?'':'s');
              toast(msg);renderMonth();
            }else if(action==='delete'){
              const grouped=[...SELECTED_ITEMS].filter(function(id){const r=_findItemRecordById(id);return !!(r&&_itemHasGroupedSale(r.item));});
              if(grouped.length){toast('Grouped-order items can’t be deleted individually. Correct the grouped order first.','err');return;}""",
            'monthly bulk actions'
          )

          sub1(
            r"(async function stockBulkAction\(action,items\)\{.*?\n)  if\(action==='sold'\)\{.*?\n  \}else if\(action==='delete'\)\{",
            r"""\1  if(action==='sold'){
              const today=new Date().toISOString().split('T')[0];let changed=0,relistedSkipped=0,invalidSkipped=0;
              actionable.forEach(function(id){
                const rec=_findItemRecordById(id),found=rec&&rec.item;
                if(!found||!_lifecycleCan(found,'markSold')){invalidSkipped++;return;}
                if(_itemHasPriorFullReturn(found)){relistedSkipped++;return;}
                found.dateSold=today;found.isReturned=false;found.state='sold';
                if(!found.soldOnPlatform)found.soldOnPlatform=_itemPlatform(found);
                found.grossProfit=calcGrossProfit(found);changed++;
              });
              if(!changed){
                const msg=relistedSkipped?'Relisted items must be sold individually so Sale 2+ is recorded correctly':protectedIds.length?'Selected item is managed through a Job Lot':'No selected listed items can be sold';
                toast(msg,'err');return;
              }
              saveDB();STOCK_SELECTED.clear();STOCK_SELECTION_MODE=false;
              let msg='Marked '+changed+' item'+(changed===1?'':'s')+' as sold';
              if(relistedSkipped)msg+=' · skipped '+relistedSkipped+' relisted item'+(relistedSkipped===1?'':'s');
              if(protectedIds.length)msg+=' · skipped '+protectedIds.length+' Job Lot item'+(protectedIds.length===1?'':'s');
              toast(msg);renderStock();
            }else if(action==='delete'){
              const grouped=actionable.filter(function(id){const r=_findItemRecordById(id);return !!(r&&_itemHasGroupedSale(r.item));});
              if(grouped.length){toast('Grouped-order items can’t be deleted individually. Correct the grouped order first.','err');return;}""",
            'stock bulk actions'
          )

          # Bundle sales may contain Sale 2+ relists, but all members must remain
          # currently listed and outside Job Lots from form open through submit.
          pairs=[
            ("if(x&&!x.dateSold&&!x.isReturned)items.push({...x,_month:k});","if(x&&_lifecycleCan(x,'markSold')&&!_activeJobLotMembership(x.id))items.push({...x,_month:k});",'bundle open filter'),
            ("if(items.length<2){toast('Select at least 2 unsold items','error');return;}","if(items.length!==ids.length){toast('Some selected items are no longer available to sell. Review the selection and try again.','error');return;}\n  if(items.length<2){toast('Select at least 2 unsold items','error');return;}",'bundle open atomic guard'),
            ("if(x&&!x.dateSold&&!x.isReturned)items.push(x);","if(x&&_lifecycleCan(x,'markSold')&&!_activeJobLotMembership(x.id))items.push(x);",'bundle submit filter'),
            ("if(!items.length){toast('No unsold items found','error');return;}","if(items.length!==ids.length||items.length<2){toast('Bundle selection changed while the sale form was open. Reopen the bundle sale and review the items.','error');return;}",'bundle submit atomic guard'),
          ]
          for old,new,label in pairs:
              if s.count(old)!=1: raise SystemExit(f'{label}: expected 1, got {s.count(old)}')
              s=s.replace(old,new,1)

          sub1(
            r"(function undoActivity\(logId\)\{.*?\n\s*const before = log\.before;\n)",
            r"""\1  const currentRec=(typeof _findItemRecordById==='function')?_findItemRecordById(log.itemId):null;
              const currentItem=currentRec&&currentRec.item;
              if(_itemHasGroupedSale(before)||_itemHasGroupedSale(currentItem)){toast('Grouped order — reverse from the order or item workflow','err');return;}
              if(typeof _activeJobLotMembership==='function'&&_activeJobLotMembership(log.itemId)){toast('Item is currently in a Job Lot','err');return;}
            """,
            'activity undo guard'
          )

          sub1(
            r"(async function deleteItem\(m,id\)\{.*?\n\s*const item=\(DB\[m\]\|\|\[\]\)\.find\(i=>i\.id===id\);\n)",
            r"""\1  if(item&&_itemHasGroupedSale(item)){toast('Grouped order — correct or reverse the order before deleting an individual item','err');return;}
            """,
            'single delete grouped guard'
          )

          sub1(
            r"function openSplitModal\(m,id\)\{\n\s*const i=\(DB\[m\]\|\|\[\]\)\.find\(function\(x\)\{return x\.id===id;\}\);\n\s*if\(!i\)return;",
            """function openSplitModal(m,id){
              if(_jobLotActionGuard(id))return;
              const i=(DB[m]||[]).find(function(x){return x.id===id;});
              if(!i)return;
              if(_itemHasPriorFullReturn(i)||_itemHasGroupedSale(i)){toast('Items with sale or return history can’t be split because that would rewrite historical cost basis','err');return;}""",
            'open split guard'
          )

          sub1(
            r"function confirmSplit\(m,id\)\{\n\s*const i=\(DB\[m\]\|\|\[\]\)\.find\(function\(x\)\{return x\.id===id;\}\); if\(!i\)return;\n\s*if\(i\.dateSold\|\|i\.resaleSalePrice\|\|i\.isReturned\|\|i\.scrappedAt\)\{toast\('Only unsold items can be split'\);return;\}",
            """function confirmSplit(m,id){
              if(_jobLotActionGuard(id))return;
              const i=(DB[m]||[]).find(function(x){return x.id===id;}); if(!i)return;
              if(_itemHasPriorFullReturn(i)||_itemHasGroupedSale(i)||!['sourced','listed'].includes(_itemLifecycleState(i))){toast('Only never-sold active inventory can be split','err');return;}""",
            'confirm split guard'
          )

          sub1(
            r"function confirmScrap\(m,id\)\{\n\s*const i=\(DB\[m\]\|\|\[\]\)\.find\(function\(x\)\{return x\.id===id;\}\);\n\s*if\(!i\)return;",
            """function confirmScrap(m,id){
              if(_jobLotActionGuard(id))return;
              const i=(DB[m]||[]).find(function(x){return x.id===id;});
              if(!i)return;
              if(!_canScrap(i)){toast('This item is no longer eligible to leave active inventory','err');return;}""",
            'confirm scrap guard'
          )

          old="""  copy.accountSettled=false; // new item = new debt to the partner
            copy.returnHistory=[];delete copy.returnData;"""
          new="""  copy.accountSettled=false; // new item = new debt to the partner
            delete copy.bundleId;delete copy.bundleRef;delete copy.bundleTotal;
            delete copy.resaleBundleId;delete copy.resaleBundleRef;delete copy.resaleBundleTotal;
            copy.returnHistory=[];delete copy.returnData;"""
          if old not in s: raise SystemExit('duplicate grouped-sale reset anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify syntax and contracts
        shell: bash
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          required=[
            'function _itemHasGroupedSale(i)',
            'r._bundleIdAtReturn',
            "if(_itemHasPriorFullReturn(item)){relistedSkipped++;return;}",
            "if(_itemHasPriorFullReturn(found)){relistedSkipped++;return;}",
            "_lifecycleCan(x,'markSold')&&!_activeJobLotMembership(x.id)",
            'Bundle selection changed while the sale form was open',
            'correct or reverse the order before deleting an individual item',
            '_itemHasGroupedSale(before)||_itemHasGroupedSale(currentItem)',
            "_itemHasPriorFullReturn(i)||_itemHasGroupedSale(i)",
            'if(!_canScrap(i))',
            'delete copy.bundleId;delete copy.bundleRef;delete copy.bundleTotal;'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing lifecycle contracts: '+repr(missing))
          print('Lifecycle hardening contracts: PASS')
          PY

      - name: Commit patch and remove temporary writers
        shell: bash
        run: |
          rm -f .github/workflows/tmp-stage3-lifecycle-hardening.yml
          rm -f .github/workflows/tmp-stage3-lifecycle-hardening-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/tmp-stage3-lifecycle-hardening.yml .github/workflows/tmp-stage3-lifecycle-hardening-v2.yml
          git commit -m 'fix(lifecycle): harden bulk and grouped-order mutations'
          git push origin HEAD:audit/stage-3-data-integrity
