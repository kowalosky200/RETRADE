name: Inspect loading DOM leaks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dump-loading-dom-v1420.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Identify residual coloured data visuals
        run: |
          python -m http.server 4173 >/tmp/http.log 2>&1 &
          cat >/tmp/colors.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            for(const spec of [{tab:'summary',w:390,h:844},{tab:'stock',w:1440,h:900}]){
              const p=await b.newPage({viewport:{width:spec.w,height:spec.h}});
              await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>typeof window.showRealLayoutLoading==='function');
              await p.evaluate((tab)=>{
                const a=document.getElementById('auth-overlay');if(a)a.style.display='none';
                const ol=document.getElementById('app-loading');if(ol)ol.remove();
                document.body.classList.add('rt-app-visible');
                if(typeof DB==='object'&&DB){Object.keys(DB).forEach(k=>{if(/^[A-Z]{3}-\d{2}$/.test(k))delete DB[k];});DB.expenses=[];DB.trips=[];DB.cashLedger=[];DB.sourcingRuns=[];}
                showRealLayoutLoading(tab,'inspect');
                let n=document.getElementById('p-'+tab);while(n&&n!==document.body){const cs=getComputedStyle(n);if(cs.display==='none')n.style.display='block';if(cs.visibility==='hidden')n.style.visibility='visible';if(+cs.opacity===0)n.style.opacity='1';n=n.parentElement;}
              },spec.tab);
              await p.waitForTimeout(100);
              const found=await p.evaluate(()=>{
                const page=document.querySelector('.page.on');
                const parse=(s)=>{const m=s&&s.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m?[+m[1],+m[2],+m[3]]:null};
                const out=[];
                for(const el of page.querySelectorAll('*')){
                  const cs=getComputedStyle(el), bg=parse(cs.backgroundColor), col=parse(cs.color), fill=parse(cs.fill), stroke=parse(cs.stroke);
                  const green=(rgb)=>rgb&&rgb[1]>rgb[0]*1.25&&rgb[1]>rgb[2]*1.08&&rgb[1]>75;
                  if(green(bg)||green(col)||green(fill)||green(stroke)){
                    const r=el.getBoundingClientRect();
                    if(r.width<2||r.height<2)continue;
                    out.push({tag:el.tagName,id:el.id||'',cls:(el.className&&el.className.baseVal)||el.className||'',style:el.getAttribute('style')||'',bg:cs.backgroundColor,color:cs.color,fill:cs.fill,stroke:cs.stroke,rect:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}});
                  }
                }
                return out;
              });
              console.log('\nTAB',spec.tab,JSON.stringify(found,null,2));
              await p.close();
            }
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/colors.js
