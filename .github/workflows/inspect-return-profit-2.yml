name: Inspect return profit internals

on:
  push:
    branches:
      - audit/return-profit-bounce

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/return-profit-bounce
          fetch-depth: 0
      - name: Collect exact ranges
        run: |
          python - <<'PY'
          from pathlib import Path
          out=[]
          def rng(fn,a,b):
            lines=Path(fn).read_text(encoding='utf-8').splitlines()
            out.append(f'===== {fn} {a}-{b} =====')
            for j in range(a-1,min(b,len(lines))): out.append(f'{j+1}: {lines[j]}')
          rng('app.js',1978,2048)
          rng('app.js',6425,6525)
          rng('app.js',23295,23330)
          # locate calcGrossProfit and return impact helpers in accounting.js
          lines=Path('accounting.js').read_text(encoding='utf-8').splitlines()
          keys=['function calcGrossProfit','calcGrossProfit=','return impact','stock cost restored','platform fee credit','advertising fee credit','saleNo']
          hits=[]
          for i,l in enumerate(lines):
            if any(k.lower() in l.lower() for k in keys): hits.append(i)
          for i in hits:
            a=max(0,i-20); b=min(len(lines),i+45)
            out.append(f'===== accounting.js {a+1}-{b} =====')
            out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          Path('docs/return-profit-inspect2.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-return-profit-2.yml
          git add docs/return-profit-inspect2.txt
          git commit -m "chore: capture return profit internals"
          git push origin HEAD:audit/return-profit-bounce
