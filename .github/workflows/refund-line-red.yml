name: Refund line red

on:
  push:
    branches:
      - fix/refund-line-red

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Change refund series to red
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = "tertiaryColor:'var(--warn)'"
          new = "tertiaryColor:'var(--red)'"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 refund colour occurrences, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/refund-line-red.yml').unlink()

      - name: Validate JavaScript and diff
        run: |
          node --check app.js
          git diff --check
          test "$(grep -o "tertiaryColor:'var(--red)'" app.js | wc -l | tr -d ' ')" = "2"
          ! grep -q "tertiaryColor:'var(--warn)'" app.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dashboard): show refunds in red"
          git push origin HEAD:fix/refund-line-red
