name: TEMP Stage 3 settlement transaction integrity

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/tmp-stage3-settlement-transactions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply settlement transaction integrity patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('app.js')
          s=app.read_text(encoding='utf-8')

          def sub1(pattern,repl,label,flags=re.S):
              global s
              s2,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s=s2

          # Settlement reference helpers live beside the selected-item/allocation helpers.
          anchor="""function _selectedAccountItems(ids,accountId){
            const set=new Set(ids||[]),out=[];
            allDBKeys().forEach(function(k){
              (DB[k]||[]).forEach(function(i){
                if(set.has(i.id)&&i.accountId===accountId)out.push(Object.assign(i,{_month:k}));
              });
            });
            return out;
          }
          """
          if anchor not in s: raise SystemExit('selected account helper anchor not found')
          helpers=anchor+"""
          // Stage 3 settlement integrity — the settlement transaction is the source
          // of truth for whether partner/supplier cash actually moved. Item flags are
          // derived/synchronised from paid transactions rather than toggled directly.
          function _settlementAllocationItemId(a){return a&&(a.id||a.itemId)||null;}
          function _settlementRefsForItem(itemId){
            const out=[];
            (_accounts||[]).forEach(function(acct){
              (acct.settlements||[]).forEach(function(tx){
                const allocation=(tx.items||[]).find(function(a){return _settlementAllocationItemId(a)===itemId;});
                if(allocation)out.push({acct:acct,tx:tx,allocation:allocation});
              });
            });
            return out;
          }
          function _paidSettlementRefsForItem(itemId){return _settlementRefsForItem(itemId).filter(function(r){return !!(r.tx&&r.tx.paid);});}
          function _hasSettlementHistoryForItem(itemId){return _settlementRefsForItem(itemId).length>0;}
          function _syncItemSettlementState(itemId){
            const rec=_findItemRecordById(itemId);if(!rec||!rec.item)return;
            rec.item.accountSettled=_paidSettlementRefsForItem(itemId).length>0;
          }
          function _syncSettlementItems(tx){
            (tx&&tx.items||[]).forEach(function(a){const id=_settlementAllocationItemId(a);if(id)_syncItemSettlementState(id);});
          }
          function _snapshotSettlementKinds(acct,tx){
            if(!tx)return 0;
            let changed=0;const kinds=[];
            (tx.items||[]).forEach(function(a){
              if(!a)return;
              if(!a.kind){
                const id=_settlementAllocationItemId(a),rec=id?_findItemRecordById(id):null;
                a.kind=rec&&rec.item?_itemAccountType(rec.item):(tx.kind||acct.accountType||'supplier');
                changed++;
              }
              kinds.push(a.kind||'supplier');
            });
            if(!tx.kind){
              const uniq=Array.from(new Set(kinds));
              if(uniq.length===1)tx.kind=uniq[0];
              else if(uniq.length&&uniq.every(function(k){return k!=='supplier';}))tx.kind='partner';
              else if(uniq.length>1)tx.kind='mixed';
              else tx.kind=acct.accountType||'supplier';
              changed++;
            }
            return changed;
          }
          function _applySettlementPaidState(acct,tx,paid,date){
            if(!acct||!tx)return false;
            _snapshotSettlementKinds(acct,tx);
            if(paid){
              tx.paid=true;tx.date=date||todayISO();tx.paidAt=new Date().toISOString();delete tx.reversedAt;
              if((Number(tx.partnerAmount)||0)>0)_recordSystemCashEvent(_systemSettlementCashId(tx.id),'partner_settlement',Number(tx.partnerAmount)||0,tx.date,'Settlement paid · '+(acct.name||'Partner')+' · '+((tx.items||[]).length)+' item'+(((tx.items||[]).length)!==1?'s':''));
            }else{
              tx.paid=false;tx.reversedAt=new Date().toISOString();delete tx.paidAt;
              _removeSystemCashEvent(_systemSettlementCashId(tx.id));
            }
            _syncSettlementItems(tx);
            return true;
          }
          function _markSettlementPaid(accountId,settlementId){
            const acct=(_accounts||[]).find(function(a){return a.id===accountId;});if(!acct)return;
            const tx=(acct.settlements||[]).find(function(t){return t.id===settlementId;});if(!tx||tx.paid)return;
            const ids=(tx.items||[]).map(_settlementAllocationItemId).filter(Boolean);
            const duplicate=ids.find(function(id){return _paidSettlementRefsForItem(id).some(function(r){return r.tx.id!==settlementId;});});
            if(duplicate){toast('An item in this allocation already belongs to another paid settlement. Resolve that duplicate first.','error');return;}
            const date=((document.getElementById('settlement-action-date')||{}).value)||todayISO();
            _applySettlementPaidState(acct,tx,true,date);saveDB();toast('Settlement marked paid');_openSettlementDetail(accountId,settlementId);
          }
          function _reverseSettlementPayment(accountId,settlementId){
            const acct=(_accounts||[]).find(function(a){return a.id===accountId;});if(!acct)return;
            const tx=(acct.settlements||[]).find(function(t){return t.id===settlementId;});if(!tx||!tx.paid)return;
            showConfirm('Reverse this payment?','The allocation is kept, but it becomes unpaid and the cash outflow is removed. Use this only to correct a payment recorded in error.',{icon:'warn',okLabel:'Reverse payment'}).then(function(ok){
              if(!ok)return;_applySettlementPaidState(acct,tx,false);saveDB();toast('Payment reversed · allocation remains unpaid');_openSettlementDetail(accountId,settlementId);
            });
          }
          """
          s=s.replace(anchor,helpers,1)

          # Mixed arrangement selection must never be pushed through the account default.
          sub1(r"function _acctBulkSettle\(\)\{.*?\n\}\n\n// Grouped supplier settlement",
          """function _acctBulkSettle(){
            if(!_acctSelected.size){toast('Select at least one item','error');return;}
            const acct=_acctCurrentAcct();if(!acct)return;
            const selected=_selectedAccountItems(Array.from(_acctSelected),acct.id);
            const eligible=selected.filter(function(i){
              if(i.accountSettled===true||_accountItemDebt(i)===null)return false;
              return _itemAccountType(i)==='supplier'||_accountItemIsSold(i);
            });
            if(!eligible.length){toast('No eligible unsettled items selected','error');return;}
            const groups=new Set(eligible.map(function(i){return _itemAccountType(i)==='supplier'?'supplier':'partner';}));
            if(groups.size>1){toast('Mixed supplier and profit-share items selected · settle each arrangement separately','error');return;}
            if(eligible.length<selected.length)toast('Using '+eligible.length+' eligible item'+(eligible.length!==1?'s':'')+' · '+(selected.length-eligible.length)+' skipped');
            const ids=eligible.map(function(i){return i.id;});
            if(groups.has('supplier'))_openSupplierSettlement(acct.id,ids);else _openConsignmentSettlementBuilder(acct.id,ids);
          }

          // Grouped supplier settlement""",'bulk settle routing')

          # Supplier builder/commit validates effective item type, not account default.
          old="""  const picked=_selectedAccountItems(ids,accountId).filter(function(i){
            return _accountItemDebt(i)!==null && !i.accountSettled;
          });"""
          new="""  const picked=_selectedAccountItems(ids,accountId).filter(function(i){
            return _itemAccountType(i)==='supplier'&&_accountItemDebt(i)!==null&&!i.accountSettled;
          });"""
          if old not in s: raise SystemExit('supplier open filter not found')
          s=s.replace(old,new,1)

          old="""  const selectedItems=_selectedAccountItems(ids||[],accountId).filter(function(i){
            return _accountItemDebt(i)!==null && !i.accountSettled;
          });
            const expected=+selectedItems.reduce(function(sum,i){return sum+(_accountItemDebt(i)||0);},0).toFixed(2);"""
          new="""  const selectedItems=_selectedAccountItems(ids||[],accountId).filter(function(i){
            return _itemAccountType(i)==='supplier'&&_accountItemDebt(i)!==null&&!i.accountSettled;
          });
            if(selectedItems.length!==ids.length){toast('Supplier settlement selection changed · reopen and review the items','error');return;}
            const expected=+selectedItems.reduce(function(sum,i){return sum+(_accountItemDebt(i)||0);},0).toFixed(2);"""
          if old not in s: raise SystemExit('supplier confirm filter not found')
          s=s.replace(old,new,1)

          old="""      if(item&&_accountItemDebt(item)!==null&&!item.accountSettled){
                allocations.push({id:item.id,amount:+( _accountItemDebt(item)||0).toFixed(2),name:item.item||''});
                item.accountSettled=true;nSettled++;
              }"""
          new="""      if(item&&_itemAccountType(item)==='supplier'&&_accountItemDebt(item)!==null&&!item.accountSettled){
                allocations.push({id:item.id,amount:+(_accountItemDebt(item)||0).toFixed(2),name:item.item||'',kind:'supplier'});
                item.accountSettled=true;nSettled++;
              }"""
          if old not in s: raise SystemExit('supplier allocation loop not found')
          s=s.replace(old,new,1)

          # Allocation helper snapshots the effective arrangement type per item.
          old="return {id:i.id,month:i._month,amount:Math.max(0,amount)};"
          new="return {id:i.id,month:i._month,amount:Math.max(0,amount),kind:_itemAccountType(i)};"
          if s.count(old)!=1: raise SystemExit(f'allocation return expected 1 got {s.count(old)}')
          s=s.replace(old,new,1)

          old="const items=selected.filter(function(i){return _accountItemIsSold(i)&&i.accountSettled!==true&&_accountItemDebt(i)!==null;});"
          new="const items=selected.filter(function(i){return _itemAccountType(i)!=='supplier'&&_accountItemIsSold(i)&&i.accountSettled!==true&&_accountItemDebt(i)!==null;});"
          if s.count(old)!=1: raise SystemExit('consignment open filter not found')
          s=s.replace(old,new,1)

          old="""  const items=_selectedAccountItems(d.itemIds,d.accountId).filter(_accountItemIsSold);
            const allocations=_allocatePartnerTotal(items,partner);"""
          new="""  const selected=_selectedAccountItems(d.itemIds,d.accountId);
            const items=selected.filter(function(i){return _itemAccountType(i)!=='supplier'&&_accountItemIsSold(i)&&i.accountSettled!==true&&_accountItemDebt(i)!==null;});
            if(items.length!==d.itemIds.length){toast('Allocation selection changed · reopen and review the items','error');return;}
            const allocations=_allocatePartnerTotal(items,partner);"""
          if old not in s: raise SystemExit('consignment confirm items not found')
          s=s.replace(old,new,1)

          old="const tx={id:_newId('stl'),date:date,createdAt:new Date().toISOString(),paid:paid,partnerAmount:partner,yourAmount:_roundMoney(d.gross-partner),grossProfit:d.gross,suggestedPartner:d.suggested,note:note||null,items:allocations};"
          new="""const _kinds=Array.from(new Set(allocations.map(function(a){return a.kind||'consignment';})));
            const _txKind=_kinds.length===1?_kinds[0]:'partner';
            const tx={id:_newId('stl'),date:date,createdAt:new Date().toISOString(),paid:paid,kind:_txKind,partnerAmount:partner,yourAmount:_roundMoney(d.gross-partner),grossProfit:d.gross,suggestedPartner:d.suggested,note:note||null,items:allocations};"""
          if s.count(old)!=1: raise SystemExit('consignment tx anchor not found')
          s=s.replace(old,new,1)

          old="if(i.accountId===accountId&&_accountItemIsSold(i)&&i.accountSettled!==true&&_accountItemDebt(i)!==null)ids.push(i.id);"
          new="if(i.accountId===accountId&&_itemAccountType(i)!=='supplier'&&_accountItemIsSold(i)&&i.accountSettled!==true&&_accountItemDebt(i)!==null)ids.push(i.id);"
          if s.count(old)!=1: raise SystemExit('consignment account filter not found')
          s=s.replace(old,new,1)

          # Settlement detail becomes the only place to reverse a transaction-backed payment
          # or mark a previously-saved unpaid allocation as paid.
          sub1(r"function _openSettlementDetail\(accountId,settlementId\)\{.*?\n\}\n\n// Printable partner remittance slip",
          """function _openSettlementDetail(accountId,settlementId){
            const acct=_accounts.find(function(a){return a.id===accountId;});if(!acct)return;
            const tx=(acct.settlements||[]).find(function(t){return t.id===settlementId;});if(!tx)return;
            _snapshotSettlementKinds(acct,tx);
            const rows=(tx.items||[]).map(function(a){
              const id=_settlementAllocationItemId(a);let found=null;if(id){const r=_findItemRecordById(id);found=r&&r.item;}
              return '<div class=\"metric-inline\"><div class=\"metric-k\">'+esc(found?found.item:(a.name||'Item no longer found'))+'</div><strong>'+fmt(a.amount||0)+'</strong></div>';
            }).join('');
            const status=tx.paid?'<div style=\"margin:12px 0;padding:9px 11px;border-radius:8px;background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);font-size:12px;font-weight:700;\">Paid · '+esc(tx.date||'')+'</div>':'<div style=\"margin:12px 0;padding:9px 11px;border-radius:8px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);font-size:12px;font-weight:700;\">Allocation saved · unpaid</div>';
            const action=tx.paid
              ? '<button class=\"btn btn-secondary\" style=\"width:100%;margin-top:8px;color:var(--red);\" onclick=\"_reverseSettlementPayment(\\\''+accountId+'\\\',\\\''+settlementId+'\\\')\">Reverse payment · keep allocation unpaid</button>'
              : '<div class=\"fg\" style=\"margin-top:14px;\"><label>Date paid</label><input type=\"date\" id=\"settlement-action-date\" value=\"'+todayISO()+'\"></div><button class=\"btn btn-primary\" style=\"width:100%;\" onclick=\"_markSettlementPaid(\\\''+accountId+'\\\',\\\''+settlementId+'\\\')\">Mark allocation paid</button>';
            openPanel('Settlement · '+(tx.date||''),'<div class=\"panel-card\">'+rows+'</div><div class=\"pnl-row total\"><span>Partner amount</span><strong>'+fmt(tx.partnerAmount||0)+'</strong></div>'+((tx.yourAmount||0)?'<div class=\"pnl-row\"><span>Your share</span><strong>'+fmt(tx.yourAmount||0)+'</strong></div>':'')+status+(tx.note?'<div style=\"margin-top:12px;font-size:12px;color:var(--text-secondary);\">'+esc(tx.note)+'</div>':'')+action
              +'<button class=\"btn btn-secondary\" style=\"width:100%;margin-top:8px\" onclick=\"downloadSettlementSlip(\\\''+accountId+'\\\',\\\''+settlementId+'\\\')\">↓ Download slip (PDF)</button>');
          }

          // Printable partner remittance slip""",'settlement detail')

          # Bulk 'unsettle' reverses complete payment transactions, never just item flags.
          sub1(r"function _acctBulkUnsettle\(\)\{.*?\n\}\n\n// Bulk set cost",
          """function _acctBulkUnsettle(){
            if(!_acctSelected.size)return;
            const selected=new Set(Array.from(_acctSelected));const txRefs=new Map();const orphan=[];
            selected.forEach(function(id){
              const paid=_paidSettlementRefsForItem(id);
              if(!paid.length){const r=_findItemRecordById(id);if(r&&r.item&&r.item.accountSettled)orphan.push(id);return;}
              paid.forEach(function(ref){txRefs.set(ref.acct.id+'::'+ref.tx.id,ref);});
            });
            const partial=Array.from(txRefs.values()).find(function(ref){return (ref.tx.items||[]).some(function(a){const id=_settlementAllocationItemId(a);return id&&!selected.has(id);});});
            if(partial){toast('A selected item shares a payment with unselected items · reverse that full settlement from Settlement History','error');_openSettlementDetail(partial.acct.id,partial.tx.id);return;}
            if(!txRefs.size&&!orphan.length){toast('No paid selected items to reverse');return;}
            showConfirm('Reverse selected payment'+(txRefs.size===1?'':'s')+'?','Recorded payments will become unpaid and their cash outflows will be removed. Legacy settled flags with no transaction will simply be cleared.',{icon:'warn',okLabel:'Reverse'}).then(function(ok){
              if(!ok)return;Array.from(txRefs.values()).forEach(function(ref){_applySettlementPaidState(ref.acct,ref.tx,false);});
              orphan.forEach(function(id){const r=_findItemRecordById(id);if(r&&r.item)r.item.accountSettled=false;});
              saveDB();toast('Reversed '+txRefs.size+' payment'+(txRefs.size===1?'':'s')+(orphan.length?' · cleared '+orphan.length+' legacy flag'+(orphan.length===1?'':'s'):'') );
              _acctSelected.clear();_acctSelectMode=false;const acct=_acctCurrentAcct();if(acct)_renderAccountPage(acct);
            });
          }

          // Bulk set cost""",'bulk unsettle')

          # Settle-all follows effective item arrangement; mixed accounts must be handled
          # as separate payment groups rather than one ambiguous transaction.
          sub1(r"function settleAllForAccount\(accountId\)\{.*?\n\}\n\n// Per-item split editor",
          """function settleAllForAccount(accountId){
            const acct=_accounts.find(function(a){return a.id===accountId;});
            if(!acct){toast('Account not found','error');return;}
            const eligible=_accountItems(accountId).filter(function(i){
              if(i.accountSettled===true||_accountItemDebt(i)===null)return false;
              return _itemAccountType(i)==='supplier'||_accountItemIsSold(i);
            });
            if(!eligible.length){toast('Nothing outstanding to settle');return;}
            const groups=new Set(eligible.map(function(i){return _itemAccountType(i)==='supplier'?'supplier':'partner';}));
            if(groups.size>1){toast('This account has both supplier and profit-share liabilities · select and settle each arrangement separately','error');return;}
            const ids=eligible.map(function(i){return i.id;});
            if(groups.has('supplier'))_openSupplierSettlement(accountId,ids);else _openConsignmentSettlementBuilder(accountId,ids);
          }

          // Per-item split editor""",'settle all routing')

          # Per-row paid state routes into the relevant transaction workflow.
          sub1(r"function toggleItemSettled\(month,itemId,ev\)\{.*?\n\}\n\n// ── Account create / edit",
          """function toggleItemSettled(month,itemId,ev){
            if(ev){ev.stopPropagation();ev.preventDefault();}
            const item=(DB[month]||[]).find(function(i){return i.id===itemId;});
            if(!item){toast('Item not found','error');return;}
            if(_accountItemDebt(item)===null){toast('No owed amount to settle','error');return;}
            const paid=_paidSettlementRefsForItem(itemId);
            if(paid.length){toast('Payment is transaction-backed · reverse it from this settlement if it was recorded in error');_openSettlementDetail(paid[0].acct.id,paid[0].tx.id);return;}
            const unpaid=_settlementRefsForItem(itemId).find(function(r){return !r.tx.paid;});
            if(unpaid){_openSettlementDetail(unpaid.acct.id,unpaid.tx.id);return;}
            if(item.accountSettled){
              showConfirm('Clear legacy settled flag?','No payment transaction exists for this item, so no cash movement will be changed.',{icon:'warn',okLabel:'Mark unpaid'}).then(function(ok){if(!ok)return;item.accountSettled=false;saveDB();toast('Marked unpaid · no cash transaction existed');const a=_accounts.find(function(x){return x.id===item.accountId;});if(a)_renderAccountPage(a);});
              return;
            }
            if(_itemAccountType(item)==='supplier')_openSupplierSettlement(item.accountId,[item.id]);
            else if(_accountItemIsSold(item))_openConsignmentSettlementBuilder(item.accountId,[item.id]);
            else toast('Profit-share items are settled after sale','error');
          }

          // ── Account create / edit""",'toggle settled')

          # Do not infer historical cash payment where no transaction/date exists.
          old="""// One-time migration: pre-existing supplier items with a cost and no explicit
          // settled flag default to settled (historical car-boot/wholesale buys were paid
          // on the spot). New supplier items going forward keep accountSettled=false
          // unless explicitly toggled. Idempotent — guarded by a DB flag so it only runs
          // once per install; safe to call from init.
          function _migrateSupplierSettledOnce(){
            if(DB._supplierSettledMigrated)return 0;
            let n=0;
            allDBKeys().forEach(function(k){
              (DB[k]||[]).forEach(function(i){
                if(!i.accountId)return;
                const eff=_itemAccountType(i);
                if(eff!=='supplier')return;
                if((i.costPrice||0)<=0)return;
                if(i.accountSettled===undefined){i.accountSettled=true;n++;}
              });
            });
            DB._supplierSettledMigrated=true;
            return n;
          }
          """
          new="""// One-time migration for legacy rows with no explicit payment state. Absence of
          // a dated settlement is not evidence that cash moved, so undefined now becomes
          // unpaid. Existing explicit true values are left untouched for manual review.
          function _migrateSupplierSettledOnce(){
            if(DB._supplierSettledMigrated)return 0;
            let n=0;
            allDBKeys().forEach(function(k){
              (DB[k]||[]).forEach(function(i){
                if(!i.accountId||_itemAccountType(i)!=='supplier'||(i.costPrice||0)<=0)return;
                if(i.accountSettled===undefined){i.accountSettled=false;n++;}
              });
            });
            DB._supplierSettledMigrated=true;
            return n;
          }
          function _migrateSettlementKindsOnce(){
            if(DB._settlementKindsMigrated)return 0;
            let n=0;(_accounts||[]).forEach(function(acct){(acct.settlements||[]).forEach(function(tx){n+=_snapshotSettlementKinds(acct,tx);});});
            DB._settlementKindsMigrated=true;return n;
          }
          """
          if old not in s: raise SystemExit('supplier legacy migration block not found')
          s=s.replace(old,new,1)

          # Run kind snapshot migration with the existing launch migrations.
          old="try{ if(typeof _migrateSupplierSettledOnce==='function')_migrateSupplierSettledOnce(); }catch(e){ console.warn('supplier settle migrate (preview):',e); }"
          new=old+"\n  try{ if(typeof _migrateSettlementKindsOnce==='function')_migrateSettlementKindsOnce(); }catch(e){ console.warn('settlement kind migrate (preview):',e); }"
          if s.count(old)!=1: raise SystemExit('preview supplier migration call not found')
          s=s.replace(old,new,1)

          old="let _supplierMigrated=0,_saleNoMigrated=0,_cashAuditBackfilled=0;"
          new="let _supplierMigrated=0,_settlementKindMigrated=0,_saleNoMigrated=0,_cashAuditBackfilled=0;"
          if s.count(old)!=1: raise SystemExit('migration counters anchor not found')
          s=s.replace(old,new,1)
          old="try{if(typeof _migrateSupplierSettledOnce==='function')_supplierMigrated=_migrateSupplierSettledOnce()||0;}catch(e){console.warn('supplier settle migration failed',e);}"
          new=old+"\n    try{if(typeof _migrateSettlementKindsOnce==='function')_settlementKindMigrated=_migrateSettlementKindsOnce()||0;}catch(e){console.warn('settlement kind migration failed',e);}"
          if s.count(old)!=1: raise SystemExit('main supplier migration call not found')
          s=s.replace(old,new,1)
          old="if(_reconciled>0||_supplierMigrated>0||_saleNoMigrated>0||_cashAuditBackfilled>0){"
          new="if(_reconciled>0||_supplierMigrated>0||_settlementKindMigrated>0||_saleNoMigrated>0||_cashAuditBackfilled>0){"
          if s.count(old)!=1: raise SystemExit('migration dirty condition not found')
          s=s.replace(old,new,1)

          app.write_text(s,encoding='utf-8')

          # Tax cash-basis classification must use immutable allocation/transaction
          # snapshots, not the account's current type.
          ap=Path('accounting.js')
          a=ap.read_text(encoding='utf-8')
          old="const hit=(tx.items||[]).some(function(a){return a&&a.id===itemId;});"
          new="const hit=(tx.items||[]).some(function(a){return a&&((a.id||a.itemId)===itemId);});"
          if a.count(old)!=1: raise SystemExit('paid settlement lookup anchor not found')
          a=a.replace(old,new,1)
          old="""      const kind=tx.kind||acct.accountType||'supplier';
                if(kind!=='supplier')partnerPaid+=Math.max(0,Number(tx.partnerAmount)||0);"""
          new="""      const allocs=tx.items||[];
                if(allocs.length&&allocs.some(function(x){return x&&x.kind;})){
                  partnerPaid+=allocs.reduce(function(sum,x){return sum+((x&&x.kind!=='supplier')?Math.max(0,Number(x.amount)||0):0);},0);
                }else{
                  const kind=tx.kind||acct.accountType||'supplier';
                  if(kind!=='supplier')partnerPaid+=Math.max(0,Number(tx.partnerAmount)||0);
                }"""
          if old not in a: raise SystemExit('tax settlement kind anchor not found')
          a=a.replace(old,new,1)
          ap.write_text(a,encoding='utf-8')
          PY

      - name: Verify syntax and settlement contracts
        shell: bash
        run: |
          node --check app.js
          node --check accounting.js
          python - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8');a=Path('accounting.js').read_text(encoding='utf-8')
          required_app=[
            'function _settlementRefsForItem(itemId)',
            'function _applySettlementPaidState(acct,tx,paid,date)',
            'function _markSettlementPaid(accountId,settlementId)',
            'function _reverseSettlementPayment(accountId,settlementId)',
            "_itemAccountType(i)==='supplier'&&_accountItemDebt(i)!==null",
            "_itemAccountType(i)!=='supplier'&&_accountItemIsSold(i)",
            "kind:_itemAccountType(i)",
            "const _txKind=_kinds.length===1?_kinds[0]:'partner';",
            'Mixed supplier and profit-share items selected',
            'This account has both supplier and profit-share liabilities',
            'Clear legacy settled flag?',
            'if(i.accountSettled===undefined){i.accountSettled=false;n++;}',
            'function _migrateSettlementKindsOnce()',
            '_settlementKindMigrated>0'
          ]
          missing=[x for x in required_app if x not in s]
          if missing: raise SystemExit('missing app contracts: '+repr(missing))
          required_acc=["(a.id||a.itemId)===itemId","allocs.some(function(x){return x&&x.kind;})","x.kind!=='supplier'"]
          missing=[x for x in required_acc if x not in a]
          if missing: raise SystemExit('missing accounting contracts: '+repr(missing))
          print('Settlement transaction contracts: PASS')
          PY

      - name: Commit patch and self-remove writer
        shell: bash
        run: |
          rm .github/workflows/tmp-stage3-settlement-transactions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js accounting.js .github/workflows/tmp-stage3-settlement-transactions.yml
          git commit -m 'fix(accounting): make settlements transaction-backed'
          git push origin HEAD:audit/stage-3-data-integrity
