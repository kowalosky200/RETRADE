name: Apply polished real-layout loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/loading-polish-v1418.yml'
      - '.github/scripts/apply_loading_polish_v1418.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  patch-test-deploy-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v1.4.18 loading polish
        run: python .github/scripts/apply_loading_polish_v1418.py

      - name: Static validation
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          for token in [
            "var VERSION='1.4.13-2026-09-02'",
            'v1.4.14 real-layout boot loading loaded',
            'v1.4.15 stable return identity loaded',
            'v1.4.16 bulk platform editing loaded',
            'v1.4.17 terminal disposal durability loaded',
            'v1.4.18 polished real-layout loading loaded',
          ]: assert token in js, token
          assert 'el.innerHTML=_loadingItemRows' not in js
          assert 'rt-loading-list-overlay' in js and 'rt-loading-list-overlay' in css
          assert 'requestAnimationFrame(function(){requestAnimationFrame' in js
          assert 'Math.max(0,260-elapsed)' in js
          assert 'rt-skel' not in css
          assert './app.js?v=1.4.18' in idx
          assert './app.css?v=1.4.18' in idx
          assert css.count('{') == css.count('}')
          print('v1.4.18 static validation passed')
          PY

      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Run responsive visual stress test
        run: |
          python -m http.server 4173 >/tmp/retrade-http.log 2>&1 &
          echo $! >/tmp/retrade-http.pid
          cat > /tmp/loading-visual-test.js <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[
              {name:'mobile',w:390,h:844},
              {name:'tablet',w:768,h:1024},
              {name:'desktop',w:1440,h:900},
            ];
            const tabs=['summary','monthly','stock'];
            fs.mkdirSync('loading-visual-artifacts',{recursive:true});
            for(const vp of cases){
              for(const tab of tabs){
                const page=await browser.newPage({viewport:{width:vp.w,height:vp.h}});
                await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>typeof window.showRealLayoutLoading==='function',{timeout:15000});
                await page.evaluate((tab)=>{
                  const auth=document.getElementById('auth-overlay'); if(auth)auth.style.display='none';
                  const loading=document.getElementById('app-loading'); if(loading)loading.remove();
                  document.body.classList.add('rt-app-visible');
                  const seed=`(function(){
                    if(typeof DB!=='object')throw new Error('DB unavailable');
                    Object.keys(DB).forEach(function(k){if(/^[A-Z]{3}-\\d{2}$/.test(k))delete DB[k];});
                    DB['AUG-26']=[
                      {id:'vis-sold',gid:'R-V001',item:'Visual Test Sold',state:'sold',dateSourced:'2026-08-01',dateListed:'2026-08-03',dateSold:'2026-08-20',salePrice:79.99,costPrice:20,postage:0,shippingCost:3.65,packagingCost:0,promoPercent:.05,listingFee:.36,isReturned:false,returnHistory:[],parts:[],defaultPlatform:'ebay_biz',salePlatform:'ebay_biz'},
                      {id:'vis-return',gid:'R-V002',item:'Visual Test Returned',state:'returned',dateSourced:'2026-08-02',dateListed:'2026-08-04',dateSold:null,salePrice:49.99,costPrice:12,postage:0,shippingCost:3.65,packagingCost:0,promoPercent:.05,listingFee:.36,isReturned:true,returnHistory:[{id:9001,saleNo:1,type:'full_seller',loggedAt:'2026-08-25',refundAmount:49.99,returnPostage:0,_dateSoldAtReturn:'2026-08-18',_salePriceAtReturn:49.99,_relistedAt:null}],parts:[],defaultPlatform:'ebay_biz'},
                    ];
                    DB['SEP-26']=[
                      {id:'vis-listed',gid:'R-V003',item:'Visual Test Listed',state:'listed',dateSourced:'2026-09-01',dateListed:'2026-09-01',dateSold:null,salePrice:39.99,costPrice:8,postage:0,shippingCost:3.65,packagingCost:0,promoPercent:.05,listingFee:.36,isReturned:false,returnHistory:[],parts:[],defaultPlatform:'ebay_biz'},
                      {id:'vis-sourced',gid:'R-V004',item:'Visual Test Unlisted',state:'sourced',dateSourced:'2026-09-02',dateListed:null,dateSold:null,salePrice:0,estSalePrice:55,costPrice:10,postage:0,shippingCost:0,packagingCost:0,promoPercent:0,listingFee:0,isReturned:false,returnHistory:[],parts:[],defaultPlatform:'ebay_biz'}
                    ];
                    DB.expenses=Array.isArray(DB.expenses)?DB.expenses:[];
                    DB.trips=Array.isArray(DB.trips)?DB.trips:[];
                    DB.cashLedger=Array.isArray(DB.cashLedger)?DB.cashLedger:[];
                  })()`;
                  eval(seed);
                  window.showRealLayoutLoading(tab,'Visual test');
                  let node=document.getElementById('p-'+tab);
                  while(node && node!==document.body){
                    const cs=getComputedStyle(node);
                    if(cs.display==='none')node.style.display='block';
                    if(cs.visibility==='hidden')node.style.visibility='visible';
                    if(Number(cs.opacity)===0)node.style.opacity='1';
                    node=node.parentElement;
                  }
                },tab);
                await page.waitForTimeout(110);
                const stats=await page.evaluate(()=>({
                  busy:document.querySelectorAll('.page.on[aria-busy="true"]').length,
                  values:document.querySelectorAll('.page.on .rt-data-loading').length,
                  charts:document.querySelectorAll('.page.on .rt-chart-loading,.page.on .rt-chart-data-loading').length,
                  lists:document.querySelectorAll('.page.on .rt-loading-list-overlay').length,
                  disabled:document.querySelectorAll('.page.on button:disabled,.page.on input:disabled,.page.on select:disabled').length,
                  fake:document.querySelectorAll('.rt-skel').length,
                  bodyLoading:document.body.classList.contains('rt-real-layout-loading'),
                  pageRect:(()=>{const el=document.querySelector('.page.on');if(!el)return null;const r=el.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height};})(),
                  html:(()=>{const el=document.querySelector('.page.on');return el?el.innerHTML.slice(0,12000):'';})(),
                }));
                if(!stats.bodyLoading || stats.busy!==1 || stats.values<1 || stats.fake!==0 || !stats.pageRect || stats.pageRect.w<100){
                  console.log('LOADER_MARKUP_START');console.log(stats.html);console.log('LOADER_MARKUP_END');
                  throw new Error(`${vp.name}/${tab} bad loading state ${JSON.stringify({...stats,html:undefined})}`);
                }
                await page.screenshot({path:`loading-visual-artifacts/${vp.name}-${tab}.png`,fullPage:true});
                await page.evaluate((tab)=>window.finishRealLayoutLoading(tab),tab);
                await page.waitForTimeout(420);
                const after=await page.evaluate(()=>({
                  loading:document.body.classList.contains('rt-real-layout-loading'),
                  masks:document.querySelectorAll('.rt-data-loading,.rt-loading-list-overlay,.rt-chart-loading,.rt-chart-data-loading').length,
                  pageRect:(()=>{const el=document.querySelector('.page.on');if(!el)return null;const r=el.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height};})(),
                }));
                if(after.loading || after.masks!==0)throw new Error(`${vp.name}/${tab} loader did not clear ${JSON.stringify(after)}`);
                if(stats.pageRect && after.pageRect){
                  if(Math.abs(stats.pageRect.x-after.pageRect.x)>1 || Math.abs(stats.pageRect.w-after.pageRect.w)>1)
                    throw new Error(`${vp.name}/${tab} layout shifted ${JSON.stringify({before:stats.pageRect,after:after.pageRect})}`);
                }
                console.log(vp.name,tab,{...stats,html:undefined});
                await page.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/loading-visual-test.js

      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: retrade-v1418-loading-visuals
          path: loading-visual-artifacts/*.png
          retention-days: 7

      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "fix(ui): polish in-place loading skeletons"
            git push
          fi
