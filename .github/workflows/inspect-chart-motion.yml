name: Inspect chart motion
on:
  push:
    branches: [ui/dashboard-area-motion-v1-4-32]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dashboard-area-motion-v1-4-32
      - name: Inspect relevant chart code
        run: |
          echo '--- renderer 13435-13635 ---'
          sed -n '13435,13635p' app.js
          echo '--- draw gate 13590-13655 ---'
          sed -n '13590,13665p' app.js
          echo '--- chart CSS 2028-2068 ---'
          sed -n '2028,2068p' app.css
          echo '--- v1.4.31 CSS ---'
          sed -n '5460,5560p' app.css
