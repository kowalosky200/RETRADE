name: Temporary Dashboard bucket fix v1.4.37

on:
  push:
    branches:
      - ui/swap-dashboard-fy-charts-v1-4-37

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/swap-dashboard-fy-charts-v1-4-37
      - name: Fix range bucketing
        run: python scripts/fix_chart_buckets_v1437.py
      - name: Validate
        run: |
          node --check app.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          assert 'if(_summarySpanDays<=10)' in app
          assert 'let bucketDays=_summarySpanDays<=65?7:(_summarySpanDays<=100?14:30);' in app
          print('Dashboard bucket invariants passed')
          PY
      - name: Commit and remove temporary tooling
        run: |
          rm -f scripts/fix_chart_buckets_v1437.py .github/workflows/temp-fix-chart-buckets-v1437.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/fix_chart_buckets_v1437.py .github/workflows/temp-fix-chart-buckets-v1437.yml
          git commit -m "fix(charts): bucket Dashboard rolling periods"
          git push origin HEAD:ui/swap-dashboard-fy-charts-v1-4-37
