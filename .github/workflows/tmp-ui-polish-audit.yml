name: Temporary UI polish audit

on:
  push:
    branches:
      - ui/loading-cashflow-polish

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print targeted implementation contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('app.js').read_text(encoding='utf-8').splitlines()
          needles = [
              'data-cash-edit',
              'cash-ledger-edit',
              'list.appendChild(entries)',
              'sourceStats()',
              'data-cash-type',
              'resetCashFlow',
          ]
          print(f'app.js lines: {len(lines)}')
          for needle in needles:
              hits=[i for i,line in enumerate(lines) if needle in line]
              print(f'\n--- {needle!r}: {len(hits)} hit(s) ---')
              for i in hits[:12]:
                  lo=max(0,i-45); hi=min(len(lines),i+75)
                  print(f'\n### lines {lo+1}-{hi} (hit {i+1})')
                  for n in range(lo,hi): print(f'{n+1:06d}: {lines[n]}')
          PY
