name: Fix return profit and donut endpoint

on:
  push:
    branches:
      - audit/return-profit-bounce

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/return-profit-bounce
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/tmp_patch_return_profit.py

      - name: Validate
        run: |
          node --check app.js
          node --check accounting.js
          git diff --check
          grep -q "Relist estimate · live ask + stock basis once" accounting.js
          grep -q "const rlStockBasis=rlItemCost+rlPartsCost" app.js
          grep -q "rtDonutEndpointBounce 300ms" index.html
          ! grep -q "rtDonutFinishBounce" index.html
          ! grep -q "cat-donut-chart:has(svg.cat-donut-draw)" index.html

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-return-profit-donut.yml scripts/tmp_patch_return_profit.py
          rm -f docs/return-profit-inspect.txt docs/return-profit-inspect2.txt docs/item-profit-context.txt docs/sale1-receipt-context.txt docs/sale1-vars-context.txt docs/donut-motion-context.txt
          git add -A accounting.js app.js index.html docs .github/workflows scripts
          git commit -m "fix: reconcile return projections and donut endpoint motion"
          git push origin HEAD:audit/return-profit-bounce
