name: Apply bulk platform correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lifecycle-identity-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.4.16 bulk platform correction
        run: python .github/scripts/apply_lifecycle_identity_fix.py
      - name: Validate
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('app.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          assert "var VERSION='1.4.13-2026-09-02'" in js
          assert 'v1.4.14 real-layout boot loading loaded' in js
          assert 'v1.4.15 stable return identity loaded' in js
          assert 'v1.4.16 bulk platform editing loaded' in js
          assert './app.js?v=1.4.16' in idx
          assert 'data-source="month" onchange=' not in js
          assert 'data-source="stock" onchange=' not in js
          assert "item.salePlatform=platId;" in js
          assert "item.resalePlatform=platId;" in js
          print('v1.4.16 bulk platform validation passed')
          PY
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "fix(sales): repair bulk platform editing"
            git push
          fi
