name: Stage 3 lifecycle code index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-lifecycle-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grouped-order mutation audit
        shell: bash
        run: |
          echo '=== SALES ROW ACTIONS 14720-15070 ==='
          sed -n '14720,15070p' app.js
          echo '=== BUNDLE PAGE / SUMMARY 15835-15995 ==='
          sed -n '15835,15995p' app.js
          echo '=== BUNDLE HELPERS / RETURNS ==='
          grep -nEi "function[[:space:]]+.*bundle|bundle.*(delete|undo|reverse|remove|unlink)|delete.*bundle|undo.*bundle" app.js | head -n 220 || true
