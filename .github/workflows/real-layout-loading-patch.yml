name: Apply real-layout loading patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-layout-loading-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply current-main loading patch
        run: python .github/scripts/apply_real_layout_loading.py
      - name: Validate JavaScript and patch boundaries
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          assert "var VERSION='1.4.13-2026-09-02'" in js
          assert 'v1.4.14 real-layout boot loading loaded' in js
          assert 'function showLoadingScreen(' not in js
          assert 'function hideLoadingScreen(' not in js
          assert 'rt-skel' not in css
          assert '#app-loading' not in css
          assert './app.js?v=1.4.14' in idx
          assert './app.css?v=1.4.14' in idx
          assert css.count('{')==css.count('}'), (css.count('{'),css.count('}'))
          print('real-layout loading validation passed')
          PY
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          if git diff --cached --quiet; then
            echo "No production changes"
          else
            git commit -m "feat(ui): replace mimic skeleton with real-layout loading"
            git push
          fi
