name: Stage 3 cash and ledger index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-cash-ledger-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settlement mutation anchors
        shell: bash
        run: |
          echo '=== BULK SPLIT / UNSETTLE / COST 9600-9745 ==='
          sed -n '9600,9745p' app.js
          echo
          echo '=== LEGACY SUPPLIER MIGRATION 9745-9785 ==='
          sed -n '9745,9785p' app.js
          echo
          echo '=== SETTLE ALL + TOGGLE 10130-10325 ==='
          sed -n '10130,10325p' app.js
          echo
          echo '=== SUPPLIER SETTLEMENT 9380-9460 ==='
          sed -n '9380,9460p' app.js
          echo
          echo '=== CONSIGNMENT SETTLEMENT 9460-9550 ==='
          sed -n '9460,9550p' app.js
          echo
          echo '=== ACCOUNT ASSIGN CONFIRM 10570-10615 ==='
          sed -n '10570,10615p' app.js
          echo
          echo '=== ACCOUNTING TAX CASH 1010-1065 ==='
          sed -n '1010,1065p' accounting.js
          echo
          echo '=== CASH REGRESSION TESTS 1845-1965 ==='
          sed -n '1845,1965p' accounting.js
