name: Stage 1 extract sync snippets

on:
  push:
    paths:
      - '.github/workflows/stage1-extract-sync-snippets.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract sync functions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('app.js').read_text(encoding='utf-8')
          lines=text.splitlines()
          needles=[
            'async function loadFromSupabase',
            'function saveDB',
            'function _stageDurableOutboxNow',
            'function _recoverOutbox',
            '_recoverOutbox=',
            'async function _persistChangesPass',
            '_persistChangesPass=async function',
            'function _persistChanges()',
            'async function _refreshCloudOnResume',
            'function _startRealtimeSync',
            'function _readSyncClockRevision',
            'function _queueSyncClockRefresh',
            'function _outboxEntry',
            'function _dbFingerprint',
            'v1.4.9',
            'v1.4.11'
          ]
          hits=[]
          for i,line in enumerate(lines):
            if any(n in line for n in needles):
              hits.append(i)
          # Merge +-70 line windows around hits.
          spans=[]
          for i in hits:
            a=max(0,i-70); b=min(len(lines),i+150)
            if spans and a<=spans[-1][1]+5: spans[-1][1]=max(spans[-1][1],b)
            else: spans.append([a,b])
          out=[]
          for a,b in spans:
            out.append(f'\n===== LINES {a+1}-{b} =====\n')
            for j in range(a,b): out.append(f'{j+1:05d}: {lines[j]}\n')
          Path('stage1-sync-snippets.txt').write_text(''.join(out),encoding='utf-8')
          print('Extracted',len(spans),'spans,',len(hits),'hits')
          PY
      - name: Commit audit snippet
        shell: bash
        run: |
          git config user.name 'RETRADE Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add stage1-sync-snippets.txt
          git commit -m 'chore(audit): extract Stage 1 sync code for review'
          git push
