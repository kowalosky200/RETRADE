name: Stage 1 stale-device boot guard

on:
  push:
    paths:
      - '.github/workflows/stage1-stale-device-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.4.13 patch
        run: python .github/scripts/stage1_v1413_patch.py
      - name: Validate JavaScript
        run: node --check app.js
      - name: Verify cache key
        run: grep -Fq './app.js?v=1.4.13' index.html
      - name: Commit production files
        run: |
          git config user.name 'RETRADE Stage 1 Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js index.html
          if git diff --cached --quiet; then
            echo 'No production changes to commit'
            exit 0
          fi
          git commit -m 'fix(sync): block stale-device boot writes over newer cloud data'
          git push
