name: Apply financial chart redesign

on:
  push:
    branches:
      - ui/financial-charts-v1-4-31

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui/financial-charts-v1-4-31
          fetch-depth: 0

      - name: Align patch with current chart render order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_financial_chart_redesign.py')
          s=p.read_text(encoding='utf-8')
          needle='\\n    +tertOverlay",'
          count=s.count(needle)
          if count != 2:
              raise SystemExit(f'Expected two embedded tertOverlay targets, found {count}')
          s=s.replace(needle,'",')
          old="'compact expense suggestions': 'field-recall-option' in app and '.field-recall-main' in app,"
          new="'compact expense suggestions': 'field-recall-option' in app and 'field-recall-main' in app,"
          if old not in s:
              raise SystemExit('Compact suggestion validation guard not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY

      - name: Apply redesign patch
        run: python3 scripts/apply_financial_chart_redesign.py

      - name: JavaScript syntax check
        run: node --check app.js && node --check accounting.js && node --check reports.js

      - name: Diff integrity check
        run: git diff --check

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Redesign financial charts and compact expense recall"
          git push origin HEAD:ui/financial-charts-v1-4-31
