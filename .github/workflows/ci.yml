name: RETRADE CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for file in \
            app.js app-core.js accounting.js reports.js sw.js \
            launch-experience.js performance-system.js interaction-system.js sales-defaults.js \
            bundle-orders.js bundle-panel.js bundle-row-polish.js \
            cashflow-liabilities.js partner-item-navigation.js partner-statements.js \
            item-account-adjustments.js \
            chart-polish.js chart-motion.js chart-finalize.js chart-reveal.js \
            sales-chart-sequence.js chart-forecast-sequence.js motion-system.js
          do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Repository safety checks
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch archive/legacy-site/data.json >/dev/null 2>&1; then
            echo "archive/legacy-site/data.json must not be tracked"
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(\.env($|\.)|retrade-(backup|export).*\.json$|.*\.backup\.json$)' ; then
            echo "Potential local secret/business-data backup is tracked"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          failures=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
              if p.name == 'ci.yml':
                  continue
              text=p.read_text(encoding='utf-8')
              if re.search(r'contents\s*:\s*write', text):
                  failures.append(f'{p}: contents: write')
              if re.search(r'(^|\s)git\s+push(\s|$)', text):
                  failures.append(f'{p}: git push')
          if failures:
              raise SystemExit('Unsafe repository-writing workflow detected:\n'+'\n'.join(failures))
          print('Workflow write-safety check passed')
          PY

      - name: Core file references and build alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          for required in ('app.js','app.css'):
              assert required in index, f'{required} is not referenced by index.html'

          assert "'./interaction-system.js'" in app, 'interaction-system.js is not loaded by app.js'
          assert "'interaction-system.js'" in sw, 'interaction-system.js is not in the service-worker child cache'

          app_build=re.search(r"\bvar\s+v='([^']+)'",app)
          sw_build=re.search(r"\bconst\s+BUILD='([^']+)'",sw)
          assert app_build and sw_build, 'Could not resolve app/SW build identifiers'
          assert app_build.group(1)==sw_build.group(1), f'Build mismatch: app.js={app_build.group(1)} sw.js={sw_build.group(1)}'
          print('Core references and build alignment passed:',app_build.group(1))
          PY
