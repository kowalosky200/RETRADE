name: Apply UX polish

on:
  push:
    branches:
      - ux-polish-refund-events

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ux-polish-refund-events
          fetch-depth: 0

      - name: Apply UX patch
        run: |
          # Explicit duplicate actions are allowed to reuse an amount; only the
          # passive expense suggestion must not. Remove the over-broad assertion.
          sed -i "/'expense amount not auto-recalled':/d" scripts/apply_ux_polish.py
          python3 scripts/apply_ux_polish.py

      - name: JavaScript syntax check
        run: node --check app.js && node --check accounting.js && node --check reports.js

      - name: Diff integrity check
        run: git diff --check

      - name: Commit patch if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Polish refund events and contextual form recall"
          git push origin HEAD:ux-polish-refund-events
