name: Audit v1.4.36 performance and chart motion
on:
  push:
    branches: [audit/performance-v1-4-36]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/performance-v1-4-36
      - name: Inspect sync fingerprint coverage
        run: |
          echo '=== DB FINGERPRINT ==='
          grep -n "_dbFingerprint" app.js | head -30
          n=$(grep -n "function _dbFingerprint\|_dbFingerprint=function" app.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-60)); [ $s -lt 1 ] && s=1; e=$((n+180)); sed -n "${s},${e}p" app.js; fi
          echo '=== LOAD SUPABASE ==='
          sed -n '2940,3235p' app.js
          echo '=== OTHER DATA SNAPSHOTS ==='
          grep -n "_accounts\|_sourcingRuns\|_cashLedger\|_jobLots\|_activityLog" app.js | head -160
