name: Audit v1.4.36 performance and chart motion
on:
  push:
    branches: [audit/performance-v1-4-36]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/performance-v1-4-36
      - name: Inspect analytics and sync hotspots
        run: |
          echo '=== MONTH STATS DEFINITION/OCCURRENCES ==='
          grep -n "calcMonthStatsBySale" app.js | head -80 || true
          n=$(grep -n "calcMonthStatsBySale" app.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-80)); [ $s -lt 1 ] && s=1; e=$((n+340)); sed -n "${s},${e}p" app.js; fi
          echo '=== SALE EVENT FUNCTIONS ==='
          grep -n "function getSaleEventsInMonth\|function getSaleEventsInRange\|getSaleEventsInMonth=function\|getSaleEventsInRange=function" app.js | head -40 || true
          n=$(grep -n "function getSaleEventsInMonth\|getSaleEventsInMonth=function" app.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-60)); [ $s -lt 1 ] && s=1; e=$((n+300)); sed -n "${s},${e}p" app.js; fi
          echo '=== SUMMARY STAT FUNCTIONS ==='
          grep -n "calcSummaryStats\|calcSummaryGrossStats\|calcSummaryDeltas\|calcSummaryGrossDeltas\|_statsForRange" app.js | head -100 || true
          for p in "function calcSummaryStats" "function calcSummaryGrossStats" "function _statsForRange"; do n=$(grep -n "$p" app.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-40)); [ $s -lt 1 ] && s=1; e=$((n+260)); echo "--- $p ---"; sed -n "${s},${e}p" app.js; fi; done
          echo '=== ALL ITEMS / FINGERPRINT ==='
          grep -n "function allItems\|function _dbFingerprint\|_dbFingerprint=" app.js | head -40 || true
          for p in "function allItems" "function _dbFingerprint"; do n=$(grep -n "$p" app.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-30)); [ $s -lt 1 ] && s=1; e=$((n+160)); echo "--- $p ---"; sed -n "${s},${e}p" app.js; fi; done
          echo '=== SAVE CORE ==='
          grep -n "function saveDB\|async function _persistChanges\|function _persistChanges\|_persistChanges=" app.js | head -80 || true
          n=$(grep -n "async function _persistChanges\|function _persistChanges\|_persistChanges=" app.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-100)); [ $s -lt 1 ] && s=1; e=$((n+460)); sed -n "${s},${e}p" app.js; fi
          echo '=== REFRESH ACTIVE PAGE ==='
          grep -n "function refreshActivePage\|refreshActivePage=" app.js | head -30 || true
          n=$(grep -n "function refreshActivePage\|refreshActivePage=" app.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-40)); [ $s -lt 1 ] && s=1; e=$((n+180)); sed -n "${s},${e}p" app.js; fi
          echo '=== LATE SYNC OVERRIDES 24050-24210 ==='
          sed -n '24040,24230p' app.js
          echo '=== LATE SYNC OVERRIDES 26150-26340 ==='
          sed -n '26130,26360p' app.js
          echo '=== LATE SETTINGS/SYNC 26360-26520 ==='
          sed -n '26360,26540p' app.js
          echo '=== CHART DRAW END ==='
          sed -n '13645,13720p' app.js
          echo '=== VERSION ==='
          grep -n "app.css?v\|app.js?v" index.html || true
