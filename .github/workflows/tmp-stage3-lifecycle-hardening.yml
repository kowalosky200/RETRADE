name: TEMP Stage 3 lifecycle hardening

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/tmp-stage3-lifecycle-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply lifecycle integrity guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')

          def sub1(pattern,repl,label,flags=re.S):
              global s
              s2,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              s=s2

          # Shared mutation-level helpers. Historical grouped identity survives in
          # full-return snapshots even after the active resale slot is cleared.
          lifecycle_anchor="""function _lifecycleCan(i,action){
            const s=_itemLifecycleState(i);
            if(action==='list')return s==='sourced';
            if(action==='markSold')return s==='listed';
            if(action==='return')return s==='sold';
            if(action==='relist')return s==='returned';
            if(action==='moveUnlisted')return s==='returned';
            return false;
          }
          """
          if lifecycle_anchor not in s:
              raise SystemExit('lifecycle helper anchor not found')
          helpers=lifecycle_anchor+"""
          // Stage 3 lifecycle integrity — mutation helpers. UI visibility is not a
          // security/integrity boundary: every destructive shortcut re-checks these.
          function _itemHasPriorFullReturn(i){
            return !!(i&&Array.isArray(i.returnHistory)&&i.returnHistory.some(function(r){
              return r&&(r.type==='full_seller'||r.type==='full_ebay');
            }));
          }
          function _itemGroupedSaleIds(i){
            const ids=new Set();
            if(!i)return [];
            if(i.bundleId)ids.add(i.bundleId);
            if(i.resaleBundleId)ids.add(i.resaleBundleId);
            (Array.isArray(i.returnHistory)?i.returnHistory:[]).forEach(function(r){
              if(r&&r._bundleIdAtReturn)ids.add(r._bundleIdAtReturn);
            });
            return Array.from(ids);
          }
          function _itemHasGroupedSale(i){return _itemGroupedSaleIds(i).length>0;}
          """
          s=s.replace(lifecycle_anchor,helpers,1)

          # Sales/Monthly bulk Mark Sold: only pristine Sale 1 rows are safe for the
          # shortcut. Relisted rows require the per-item Sale 2+ flow so price/date/
          # platform land in the resale slot rather than overwriting Sale 1.
          sub1(
            r"async function bulkAction\(action\)\{\n  if\(action==='sold'\)\{.*?\n  \}else if\(action==='delete'\)\{",
            """async function bulkAction(action){
            if(action==='sold'){
              const today=new Date().toISOString().split('T')[0];
              let changed=0,relistedSkipped=0,protectedSkipped=0,invalidSkipped=0;
              SELECTED_ITEMS.forEach(function(id){
                const rec=_findItemRecordById(id);
                const item=rec&&rec.item;
                if(!item){invalidSkipped++;return;}
                if(_activeJobLotMembership(id)){protectedSkipped++;return;}
                if(!_lifecycleCan(item,'markSold')){invalidSkipped++;return;}
                if(_itemHasPriorFullReturn(item)){relistedSkipped++;return;}
                item.dateSold=today;
                item.isReturned=false;
                item.state='sold';
                if(!item.soldOnPlatform)item.soldOnPlatform=_itemPlatform(item);
                item.grossProfit=calcGrossProfit(item);
                changed++;
              });
              if(!changed){
                const msg=relistedSkipped?'Relisted items must be sold individually so Sale 2+ is recorded correctly':protectedSkipped?'Selected item is managed through a Job Lot':'No selected listed items can be sold';
                toast(msg,'err');return;
              }
              saveDB();
              SELECTED_ITEMS.clear();SELECTION_MODE=false;
              let msg='Marked '+changed+' item'+(changed===1?'':'s')+' as sold';
              if(relistedSkipped)msg+=' · skipped '+relistedSkipped+' relisted item'+(relistedSkipped===1?'':'s');
              if(protectedSkipped)msg+=' · skipped '+protectedSkipped+' Job Lot item'+(protectedSkipped===1?'':'s');
              toast(msg);
              renderMonth();
            }else if(action==='delete'){""",
            'monthly bulk sold'
          )

          # Abort destructive bulk delete if any selected row belongs to a grouped
          # historical order; per-member deletion would silently rewrite bundle P&L.
          old="""  }else if(action==='delete'){
            const ok=await showConfirm('Delete '+SELECTED_ITEMS.size+' items?','This cannot be undone.',{icon:'delete',okLabel:'Delete all'});"""
          new="""  }else if(action==='delete'){
            const grouped=[...SELECTED_ITEMS].filter(function(id){const r=_findItemRecordById(id);return !!(r&&_itemHasGroupedSale(r.item));});
            if(grouped.length){toast('Grouped-order items can’t be deleted individually. Correct the grouped order first.','err');return;}
            const ok=await showConfirm('Delete '+SELECTED_ITEMS.size+' items?','This cannot be undone.',{icon:'delete',okLabel:'Delete all'});"""
          if old not in s: raise SystemExit('monthly bulk delete anchor not found')
          s=s.replace(old,new,1)

          # Stock bulk sale: same Sale 1-only shortcut rule, plus no write when no
          # item actually changes.
          sub1(
            r"  if\(action==='sold'\)\{\n    const today=.*?\n  \}else if\(action==='delete'\)\{",
            """  if(action==='sold'){
              const today=new Date().toISOString().split('T')[0];let changed=0,relistedSkipped=0,invalidSkipped=0;
              actionable.forEach(function(id){
                const rec=_findItemRecordById(id);const found=rec&&rec.item;
                if(!found||!_lifecycleCan(found,'markSold')){invalidSkipped++;return;}
                if(_itemHasPriorFullReturn(found)){relistedSkipped++;return;}
                found.dateSold=today;found.isReturned=false;found.state='sold';
                if(!found.soldOnPlatform)found.soldOnPlatform=_itemPlatform(found);
                found.grossProfit=calcGrossProfit(found);changed++;
              });
              if(!changed){
                const msg=relistedSkipped?'Relisted items must be sold individually so Sale 2+ is recorded correctly':protectedIds.length?'Selected item is managed through a Job Lot':'No selected listed items can be sold';
                toast(msg,'err');return;
              }
              saveDB();STOCK_SELECTED.clear();STOCK_SELECTION_MODE=false;
              let msg='Marked '+changed+' item'+(changed===1?'':'s')+' as sold';
              if(relistedSkipped)msg+=' · skipped '+relistedSkipped+' relisted item'+(relistedSkipped===1?'':'s');
              if(protectedIds.length)msg+=' · skipped '+protectedIds.length+' Job Lot item'+(protectedIds.length===1?'':'s');
              toast(msg);renderStock();
            }else if(action==='delete'){""",
            'stock bulk sold'
          )

          old="""  }else if(action==='delete'){
            if(protectedIds.length){toast('Remove Job Lot items from their lot before deleting them','err');return;}
            if(!actionable.length)return;
            const ok=await showConfirm('Delete '+actionable.length+' items?','This cannot be undone.',{icon:'delete',okLabel:'Delete all'});"""
          new="""  }else if(action==='delete'){
            if(protectedIds.length){toast('Remove Job Lot items from their lot before deleting them','err');return;}
            if(!actionable.length)return;
            const grouped=actionable.filter(function(id){const r=_findItemRecordById(id);return !!(r&&_itemHasGroupedSale(r.item));});
            if(grouped.length){toast('Grouped-order items can’t be deleted individually. Correct the grouped order first.','err');return;}
            const ok=await showConfirm('Delete '+actionable.length+' items?','This cannot be undone.',{icon:'delete',okLabel:'Delete all'});"""
          if old not in s: raise SystemExit('stock bulk delete anchor not found')
          s=s.replace(old,new,1)

          # Bundle sale is allowed to contain relisted Sale 2+ items because its submit
          # path already writes the correct resale slot. But every member must still be
          # actively listed and outside an active Job Lot, both when opening and submit.
          old="if(x&&!x.dateSold&&!x.isReturned)items.push({...x,_month:k});"
          new="if(x&&_lifecycleCan(x,'markSold')&&!_activeJobLotMembership(x.id))items.push({...x,_month:k});"
          if s.count(old)!=1: raise SystemExit(f'bundle open filter expected 1, got {s.count(old)}')
          s=s.replace(old,new,1)
          old="if(items.length<2){toast('Select at least 2 unsold items','error');return;}"
          new="if(items.length!==ids.length){toast('Some selected items are no longer available to sell. Review the selection and try again.','error');return;}\n  if(items.length<2){toast('Select at least 2 unsold items','error');return;}"
          if s.count(old)!=1: raise SystemExit('bundle open count guard not found')
          s=s.replace(old,new,1)

          old="if(x&&!x.dateSold&&!x.isReturned)items.push(x);"
          new="if(x&&_lifecycleCan(x,'markSold')&&!_activeJobLotMembership(x.id))items.push(x);"
          if s.count(old)!=1: raise SystemExit(f'bundle submit filter expected 1, got {s.count(old)}')
          s=s.replace(old,new,1)
          old="if(!items.length){toast('No unsold items found','error');return;}"
          new="if(items.length!==ids.length||items.length<2){toast('Bundle selection changed while the sale form was open. Reopen the bundle sale and review the items.','error');return;}"
          if s.count(old)!=1: raise SystemExit('bundle submit atomic guard not found')
          s=s.replace(old,new,1)

          # Activity undo: mirror the UI guard inside the mutation itself.
          old="""  const before = log.before;
            const targetMonth = log.month || _findItemMonth(log.itemId) || allDBKeys().slice(-1)[0];"""
          new="""  const before = log.before;
            const currentRec=(typeof _findItemRecordById==='function')?_findItemRecordById(log.itemId):null;
            const currentItem=currentRec&&currentRec.item;
            if(_itemHasGroupedSale(before)||_itemHasGroupedSale(currentItem)){toast('Grouped order — reverse from the order or item workflow','err');return;}
            if(typeof _activeJobLotMembership==='function'&&_activeJobLotMembership(log.itemId)){toast('Item is currently in a Job Lot','err');return;}
            const targetMonth = log.month || _findItemMonth(log.itemId) || allDBKeys().slice(-1)[0];"""
          if old not in s: raise SystemExit('undo activity anchor not found')
          s=s.replace(old,new,1)

          # Single delete must never remove one member from a grouped historical order.
          old="""  const item=(DB[m]||[]).find(i=>i.id===id);
            const name=item?item.item:'this item';"""
          new="""  const item=(DB[m]||[]).find(i=>i.id===id);
            if(item&&_itemHasGroupedSale(item)){toast('Grouped order — correct or reverse the order before deleting an individual item','err');return;}
            const name=item?item.item:'this item';"""
          if old not in s: raise SystemExit('single delete anchor not found')
          s=s.replace(old,new,1)

          # Split changes cost basis, so it is only valid for pristine, never-sold
          # physical stock/listings and never while a Job Lot owns the item.
          old="""function openSplitModal(m,id){
            const i=(DB[m]||[]).find(function(x){return x.id===id;});
            if(!i)return;"""
          new="""function openSplitModal(m,id){
            if(_jobLotActionGuard(id))return;
            const i=(DB[m]||[]).find(function(x){return x.id===id;});
            if(!i)return;
            if(_itemHasPriorFullReturn(i)||_itemHasGroupedSale(i)){toast('Items with sale or return history can’t be split because that would rewrite historical cost basis','err');return;}"""
          if old not in s: raise SystemExit('open split anchor not found')
          s=s.replace(old,new,1)

          old="""function confirmSplit(m,id){
            const i=(DB[m]||[]).find(function(x){return x.id===id;}); if(!i)return;
            if(i.dateSold||i.resaleSalePrice||i.isReturned||i.scrappedAt){toast('Only unsold items can be split');return;}"""
          new="""function confirmSplit(m,id){
            if(_jobLotActionGuard(id))return;
            const i=(DB[m]||[]).find(function(x){return x.id===id;}); if(!i)return;
            if(_itemHasPriorFullReturn(i)||_itemHasGroupedSale(i)||!['sourced','listed'].includes(_itemLifecycleState(i))){toast('Only never-sold active inventory can be split','err');return;}"""
          if old not in s: raise SystemExit('confirm split anchor not found')
          s=s.replace(old,new,1)

          # Scrap modal can become stale while open; re-check eligibility at commit.
          old="""function confirmScrap(m,id){
            const i=(DB[m]||[]).find(function(x){return x.id===id;});
            if(!i)return;"""
          new="""function confirmScrap(m,id){
            if(_jobLotActionGuard(id))return;
            const i=(DB[m]||[]).find(function(x){return x.id===id;});
            if(!i)return;
            if(!_canScrap(i)){toast('This item is no longer eligible to leave active inventory','err');return;}"""
          if old not in s: raise SystemExit('confirm scrap anchor not found')
          s=s.replace(old,new,1)

          # A duplicate is a new physical listing and must not remain a member of the
          # source item's historical grouped sale.
          old="""  copy.accountSettled=false; // new item = new debt to the partner
            copy.returnHistory=[];delete copy.returnData;"""
          new="""  copy.accountSettled=false; // new item = new debt to the partner
            delete copy.bundleId;delete copy.bundleRef;delete copy.bundleTotal;
            delete copy.resaleBundleId;delete copy.resaleBundleRef;delete copy.resaleBundleTotal;
            copy.returnHistory=[];delete copy.returnData;"""
          if old not in s: raise SystemExit('duplicate bundle reset anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify syntax and lifecycle contracts
        shell: bash
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          s=Path('app.js').read_text(encoding='utf-8')
          checks={
            'grouped sale helper':'function _itemHasGroupedSale(i)',
            'return snapshot grouping':'r._bundleIdAtReturn',
            'monthly Sale2 bulk guard':"if(_itemHasPriorFullReturn(item)){relistedSkipped++;return;}",
            'stock Sale2 bulk guard':"if(_itemHasPriorFullReturn(found)){relistedSkipped++;return;}",
            'bundle lifecycle filter':"_lifecycleCan(x,'markSold')&&!_activeJobLotMembership(x.id)",
            'bundle atomic submit':'Bundle selection changed while the sale form was open',
            'single grouped delete guard':'correct or reverse the order before deleting an individual item',
            'undo grouped guard':"_itemHasGroupedSale(before)||_itemHasGroupedSale(currentItem)",
            'split history guard':"_itemHasPriorFullReturn(i)||_itemHasGroupedSale(i)",
            'scrap commit guard':'if(!_canScrap(i))',
            'duplicate bundle clear':'delete copy.bundleId;delete copy.bundleRef;delete copy.bundleTotal;',
          }
          missing=[k for k,v in checks.items() if v not in s]
          if missing: raise SystemExit('missing contracts: '+', '.join(missing))
          print('Lifecycle hardening contracts: PASS')
          PY

      - name: Commit production patch and self-remove
        shell: bash
        run: |
          rm .github/workflows/tmp-stage3-lifecycle-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/tmp-stage3-lifecycle-hardening.yml
          git commit -m 'fix(lifecycle): harden bulk and grouped-order mutations'
          git push origin HEAD:audit/stage-3-data-integrity
