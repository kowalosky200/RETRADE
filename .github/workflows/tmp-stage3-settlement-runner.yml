name: TEMP Stage 3 settlement patch runner

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/tmp-stage3-settlement-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and run validated settlement patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-stage3-settlement-transactions-v2.yml').read_text(encoding='utf-8')
          start = src.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = src.index("\n          PY", start)
          raw = src[start:end]
          lines = raw.splitlines()
          code = '\n'.join((line[10:] if line.startswith('          ') else line) for line in lines) + '\n'
          Path('/tmp/stage3_settlement_patch.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/stage3_settlement_patch.py

      - name: Verify JavaScript syntax and settlement contracts
        shell: bash
        run: |
          node --check app.js
          node --check accounting.js
          grep -q "function _reverseSettlementPayment" app.js
          grep -q "function _markSettlementPaid" app.js
          grep -q "function _migrateSettlementKindsOnce" app.js
          grep -q "kind:_itemAccountType(i)" app.js
          grep -q "a.id||a.itemId" accounting.js

      - name: Commit actual patch and remove temporary writers
        shell: bash
        run: |
          git config user.name "retrade-audit-bot"
          git config user.email "retrade-audit-bot@users.noreply.github.com"
          git rm .github/workflows/tmp-stage3-settlement-transactions-v2.yml
          git rm .github/workflows/tmp-stage3-settlement-runner.yml
          git add app.js accounting.js
          git diff --cached --check
          git commit -m "fix(accounting): make settlements transaction-backed"
          git push
