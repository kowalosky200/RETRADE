name: Stage 3 lifecycle code index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-lifecycle-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helper namespace and mutation anchors
        shell: bash
        run: |
          echo '=== HELPER NAME COLLISIONS ==='
          grep -nE "_itemHasPriorFullReturn|_itemGroupedSaleIds|_itemHasGroupedSale|_safeFirstCycleBulkSale" app.js || true
          echo '=== LIFECYCLE HELPERS ==='
          grep -nE "function _itemLifecycleState|function _lifecycleCan|function _saleCycleNumbers|function _saleCycleSnapshot" app.js || true
          echo '=== BULK / DELETE / UNDO / SCRAP / SPLIT ANCHORS ==='
          grep -nE "async function bulkAction|async function stockBulkAction|function openBundleSaleModal|function submitBundleSale|function undoActivity|async function deleteItem|function confirmScrap|function openSplitModal|function confirmSplit" app.js || true
