name: Temporary UI polish apply

on:
  push:
    branches:
      - ui/loading-cashflow-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/loading-cashflow-polish
      - name: Drop brittle legacy keyframe literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/tmp_apply_ui_loading_cashflow_polish.py')
          s=p.read_text(encoding='utf-8')
          for line in [
            "css = replace_once(css, 'transform:translateY(-0.35px) scale(1.010);', 'transform:translateY(-0.45px) scale(1.014);', 'donut first overshoot')\n",
            "css = replace_once(css, 'transform:translateY(0.15px) scale(0.996);', 'transform:translateY(0.20px) scale(0.994);', 'donut recoil settle')\n",
            "css = replace_once(css, 'transform:translateY(-0.08px) scale(1.002);', 'transform:translateY(-0.10px) scale(1.003);', 'donut second settle')\n",
          ]:
            if line not in s:
              raise SystemExit('Expected legacy keyframe patch line missing')
            s=s.replace(line,'')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply deterministic patch
        run: python .github/scripts/tmp_apply_ui_loading_cashflow_polish.py
      - name: Replace legacy spreadsheet dependency with safe CSV-for-Excel export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          start=s.find('function exportCashflowExcel(){')
          end=s.find('function printCashflow(){',start)
          if start<0 or end<0 or end<=start:
            raise SystemExit('Could not isolate Cashflow export function')
          new=r'''function _cashflowCsvText(value){
            let s=value==null?'':String(value).replace(/\r?\n/g,' ');
            // Prevent spreadsheet formula execution from user-entered descriptions/sources.
            if(/^[=+\-@]/.test(s))s="'"+s;
            return '"'+s.replace(/"/g,'""')+'"';
          }
          function exportCashflowExcel(){
            const snap=_cashflowFilteredSnapshot();
            const rows=snap.rows;
            const inflow=rows.reduce(function(sum,m){return sum+(m.direction==='in'?(Number(m.amount)||0):0);},0);
            const outflow=rows.reduce(function(sum,m){return sum+(m.direction==='out'?(Number(m.amount)||0):0);},0);
            const lines=[
              ['RETRADE Cashflow'],
              ['Exported',new Date().toLocaleString('en-GB')],
              ['Rows',rows.length],
              ['Money in',inflow.toFixed(2)],
              ['Money out',outflow.toFixed(2)],
              ['Net',(inflow-outflow).toFixed(2)],
              [],
              ['Date','Direction','Type','Description','Source','Amount','Signed amount','Item ID','Sale No']
            ];
            rows.forEach(function(m){
              const amount=Number(m.amount)||0;
              lines.push([
                m.date||'',m.direction==='out'?'Out':'In',String(m.type||'cash').replace(/_/g,' '),
                m.description||'',m.source||'',amount.toFixed(2),(m.direction==='out'?-amount:amount).toFixed(2),m.itemId||'',m.saleNo==null?'':m.saleNo
              ]);
            });
            const csv=lines.map(function(row){return row.map(_cashflowCsvText).join(',');}).join('\r\n');
            const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
            const url=URL.createObjectURL(blob);
            const a=document.createElement('a');
            a.href=url;a.download='RETRADE-cashflow-'+_cashflowFileDate()+'.csv';
            document.body.appendChild(a);a.click();a.remove();
            setTimeout(function(){URL.revokeObjectURL(url);},1000);
            if(typeof toast==='function')toast('Cashflow export ready for Excel.');
          }
          '''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js
      - name: Verify UI contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          exact={
            'one renderCash':('app','function renderCash(){'),
            'Excel export':('app','function exportCashflowExcel(){'),
            'CSV injection guard':('app','function _cashflowCsvText(value){'),
            'print export':('app','function printCashflow(){'),
            '440ms loading floor':('app','const remaining=Math.max(0,440-elapsed);'),
            '540ms donut settle':('css','--dur-bounce: 540ms;'),
            '760ms donut draw':('css','--dur-draw: 760ms;'),
            'stronger donut overshoot':('app','const OVER=Math.min(RECOIL*0.30, g.rest*0.5);'),
          }
          for label,(where,needle) in exact.items():
            hay=app if where=='app' else css
            count=hay.count(needle)
            if count!=1: raise SystemExit(f'{label}: expected 1, found {count}')
          for label,needle,hay in [
            ('filtered canonical events','_cashflowFilteredSnapshot()',app),
            ('premium reveal','rtHydratedReveal',css),
            ('Excel-compatible CSV','text/csv;charset=utf-8',app),
          ]:
            if needle not in hay: raise SystemExit(f'{label}: missing')
          if idx.count('app.css?v=1.4.24')!=1 or idx.count('app.js?v=1.4.24')!=1:
            raise SystemExit('cache-bust version contract failed')
          print('UI contracts passed')
          PY
      - name: Remove temporary patch machinery
        run: |
          rm -f .github/scripts/tmp_apply_ui_loading_cashflow_polish.py
          rm -f .github/workflows/tmp-ui-polish-apply.yml
          rm -f .github/workflows/tmp-ui-polish-audit.yml
      - name: Commit production changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "ui(loading): polish reveal motion and cashflow controls"
          git push origin HEAD:ui/loading-cashflow-polish
