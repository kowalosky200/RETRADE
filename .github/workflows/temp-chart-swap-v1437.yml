name: Temporary chart swap v1.4.37

on:
  push:
    branches:
      - ui/swap-dashboard-fy-charts-v1-4-37

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/swap-dashboard-fy-charts-v1-4-37

      - name: Apply chart swap
        run: python scripts/apply_chart_swap_v1437.py

      - name: Validate JavaScript and diff
        run: |
          node --check app.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          checks={
            'dashboard contained bars':'secondaryBarsInPrimary:true' in app,
            'dashboard weekly/fortnight buckets':'_summarySpanDays<=65?7:(_summarySpanDays<=100?14:30)' in app,
            'FY revenue line legend':'monthly-legend-line--revenue' in app,
            'FY profit fill':'fillData:netProfit' in app and "fillColor:'var(--profit)'" in app,
            'FY bars disabled':'primaryBars:false' in app,
            'cache':'app.js?v=1.4.37' in index and 'app.css?v=1.4.37' in index,
            'profit bar CSS':'.rt-chart-profit-bar' in css,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Failed chart swap invariants: '+', '.join(failed))
          print('Chart swap invariants passed')
          PY

      - name: Commit application changes and remove temporary tooling
        run: |
          rm -f scripts/apply_chart_swap_v1437.py .github/workflows/temp-chart-swap-v1437.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html scripts/apply_chart_swap_v1437.py .github/workflows/temp-chart-swap-v1437.yml
          git commit -m "ui(charts): swap Dashboard bars and FY trend lines"
          git push origin HEAD:ui/swap-dashboard-fy-charts-v1-4-37
