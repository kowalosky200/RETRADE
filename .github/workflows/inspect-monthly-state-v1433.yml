name: Apply v1.4.33 monthly and dashboard patch
on:
  push:
    branches: [ui/monthly-dashboard-accounting-v1-4-33]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/monthly-dashboard-accounting-v1-4-33
          fetch-depth: 0
      - name: Correct patch targeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_monthly_dashboard_v1433.py')
          s=p.read_text(encoding='utf-8')
          fixes=[
            (
              "app=rep(app,\"${deltaChip(deltas&&deltas.grossProfit)||'After returns · before overheads'}\",\"${deltaChip(grossDeltas&&grossDeltas.profit)||'Before refunds · before overheads'}\",label='mobile gross profit foot')",
              "app=rep(app,\"${deltaChip(deltas&&deltas.grossProfit)||'After returns · before overheads'}\",\"${deltaChip(grossDeltas&&grossDeltas.profit)||'Before refunds · before overheads'}\",count=2,label='gross profit foot copy')"
            ),
            (
              "app=rep(app,\"${(deltaChip(deltas&&deltas.grossMargin,{pp:true})||'Item-level margin')}${stats.avgROI!=null?' · '+Math.round(stats.avgROI)+'% ROI':''}\",\"${(deltaChip(grossDeltas&&grossDeltas.margin,{pp:true})||'Gross profit ÷ gross revenue')}${stats.avgROI!=null?' · '+Math.round(stats.avgROI)+'% ROI':''}\",label='mobile gross margin foot')",
              "app=rep(app,\"${(deltaChip(deltas&&deltas.grossMargin,{pp:true})||'Item-level margin')}${stats.avgROI!=null?' · '+Math.round(stats.avgROI)+'% ROI':''}\",\"${(deltaChip(grossDeltas&&grossDeltas.margin,{pp:true})||'Gross profit ÷ gross revenue')}${stats.avgROI!=null?' · '+Math.round(stats.avgROI)+'% ROI':''}\",count=2,label='gross margin foot copy')"
            )
          ]
          for old,new in fixes:
            if old not in s: raise SystemExit('shared target not found')
            s=s.replace(old,new)
          # Desktop block executes after the two shared replacements, so its
          # expected source must reflect those already-updated snippets.
          s=s.replace("${deltaChip(deltas&&deltas.grossProfit)||'After returns · before overheads'}</div></div>","${deltaChip(grossDeltas&&grossDeltas.profit)||'Before refunds · before overheads'}</div></div>")
          s=s.replace("${(deltaChip(deltas&&deltas.grossMargin,{pp:true})||'Item-level margin')}${stats.avgROI!=null?' · '+Math.round(stats.avgROI)+'% ROI':''}</div></div>","${(deltaChip(grossDeltas&&grossDeltas.margin,{pp:true})||'Gross profit ÷ gross revenue')}${stats.avgROI!=null?' · '+Math.round(stats.avgROI)+'% ROI':''}</div></div>")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply v1.4.33 patch
        run: python3 scripts/apply_monthly_dashboard_v1433.py
      - name: JavaScript syntax check
        run: node --check app.js && node --check accounting.js && node --check reports.js
      - name: Patch integrity check
        run: |
          git diff --check
          grep -q "const _bootMonthlyRoute" app.js
          grep -q "Gross revenue" app.js
          grep -q "Profit breakdown" app.js
          grep -q "const refundCycles=new Map" accounting.js
          grep -q "function calcSummaryGrossStats" accounting.js
          grep -q "app.js?v=1.4.33" index.html
      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css accounting.js index.html
          if git diff --cached --quiet; then
            echo "No application changes to commit."
            exit 0
          fi
          git commit -m "Stabilise Sales routing and clarify gross vs net reporting"
          git push origin HEAD:ui/monthly-dashboard-accounting-v1-4-33
