name: Stage 3 lifecycle code index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-lifecycle-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lifecycle bypass map
        shell: bash
        run: |
          echo '=== CALL SITES: BULK / SPLIT / DUPLICATE / DELETE / BUNDLE ==='
          grep -nE "bulkAction\(|stockBulkAction\(|openSplitModal\(|confirmSplit\(|duplicateItem\(|confirmDupeItem\(|deleteItem\(|openBundleSaleModal\(|submitBundleSale\(|undoActivity\(" app.js | head -n 320 || true
          echo
          echo '=== SCRAP / SUPPLIER RETURN / RESTORE ==='
          grep -nEi "function[[:space:]]+(scrap|unScrap|openScrap|confirmScrap|supplier|returnToSupplier)|scrapReason|supplierRefund|_canScrap" app.js | head -n 320 || true
          echo
          echo '=== GROUPED / BUNDLE GUARDS ==='
          grep -nEi "bundleId|resaleBundleId|grouped order|_activeJobLotMembership|_jobLotActionGuard" app.js | grep -Ei "delete|undo|split|duplicate|sold|action|guard|return" | head -n 320 || true
          echo
          echo '=== MUTATION FUNCTION BLOCKS ==='
          sed -n '21480,22180p' app.js
          echo
          sed -n '16180,16680p' app.js
