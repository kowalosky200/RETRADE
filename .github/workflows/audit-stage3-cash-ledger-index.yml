name: Stage 3 cash and ledger index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-cash-ledger-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settlement state mutation map
        shell: bash
        run: |
          echo '=== ACCOUNT DEBT / PAYMENT HELPERS 9025-9165 ==='
          sed -n '9025,9165p' app.js
          echo
          echo '=== SETTLEMENT ROW ACTIONS 9875-9925 ==='
          sed -n '9875,9925p' app.js
          echo
          echo '=== ALL accountSettled WRITES ==='
          grep -n "accountSettled[[:space:]]*=" app.js | head -n 260 || true
          echo
          echo '=== LEGACY SUPPLIER MIGRATION CALLS ==='
          grep -n "_migrateSupplierSettledOnce" app.js || true
          echo
          echo '=== INIT AROUND MIGRATION CALL 4620-4710 ==='
          sed -n '4620,4710p' app.js
          echo
          echo '=== PAID SETTLEMENT LOOKUP accounting.js 995-1060 ==='
          sed -n '995,1060p' accounting.js
          echo
          echo '=== SETTLEMENT INTEGRITY AUDIT 19080-19130 ==='
          sed -n '19080,19130p' app.js
          echo
          echo '=== ACCOUNT DELETE / PAYMENT CLEANUP 24025-24090 ==='
          sed -n '24025,24090p' app.js
