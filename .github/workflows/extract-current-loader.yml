name: Extract current loader
on:
  push:
    branches: [main]
    paths: ['.github/workflows/extract-current-loader.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print loader block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app.js').read_text(encoding='utf-8')
          for pat in [
            r'function _renderRealLoadingTab\(.*?(?=\nfunction |\nconsole\.info)',
            r'function showRealLayoutLoading\(.*?(?=\nfunction |\nconsole\.info)',
            r'function _markLoadingRegions\(.*?(?=\nfunction _disableLoadingControls)',
          ]:
            m=re.search(pat,s,re.S)
            print('\n---BLOCK---\n')
            print(m.group(0)[:14000] if m else 'NOT FOUND')
          PY
