name: Temporary UI polish apply

on:
  push:
    branches:
      - ui/loading-cashflow-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/loading-cashflow-polish
      - name: Drop brittle legacy keyframe literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/tmp_apply_ui_loading_cashflow_polish.py')
          s=p.read_text(encoding='utf-8')
          for line in [
            "css = replace_once(css, 'transform:translateY(-0.35px) scale(1.010);', 'transform:translateY(-0.45px) scale(1.014);', 'donut first overshoot')\n",
            "css = replace_once(css, 'transform:translateY(0.15px) scale(0.996);', 'transform:translateY(0.20px) scale(0.994);', 'donut recoil settle')\n",
            "css = replace_once(css, 'transform:translateY(-0.08px) scale(1.002);', 'transform:translateY(-0.10px) scale(1.003);', 'donut second settle')\n",
          ]:
            if line not in s:
              raise SystemExit('Expected legacy keyframe patch line missing')
            s=s.replace(line,'')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply deterministic patch
        run: python .github/scripts/tmp_apply_ui_loading_cashflow_polish.py
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js
      - name: Verify UI contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          exact={
            'one renderCash':('app','function renderCash(){'),
            'Excel export':('app','function exportCashflowExcel(){'),
            'print export':('app','function printCashflow(){'),
            '440ms loading floor':('app','const remaining=Math.max(0,440-elapsed);'),
            '540ms donut settle':('css','--dur-bounce: 540ms;'),
            '760ms donut draw':('css','--dur-draw: 760ms;'),
            'stronger donut overshoot':('app','const OVER=Math.min(RECOIL*0.30, g.rest*0.5);'),
          }
          for label,(where,needle) in exact.items():
            hay=app if where=='app' else css
            count=hay.count(needle)
            if count!=1: raise SystemExit(f'{label}: expected 1, found {count}')
          for label,needle,hay in [
            ('filtered canonical events','_cashflowFilteredSnapshot()',app),
            ('premium reveal','rtHydratedReveal',css),
          ]:
            if needle not in hay: raise SystemExit(f'{label}: missing')
          if idx.count('app.css?v=1.4.24')!=1 or idx.count('app.js?v=1.4.24')!=1:
            raise SystemExit('cache-bust version contract failed')
          if 'xlsx.min.js' not in idx:
            raise SystemExit('SheetJS dependency missing')
          print('UI contracts passed')
          PY
      - name: Remove temporary patch machinery
        run: |
          rm -f .github/scripts/tmp_apply_ui_loading_cashflow_polish.py
          rm -f .github/workflows/tmp-ui-polish-apply.yml
          rm -f .github/workflows/tmp-ui-polish-audit.yml
      - name: Commit production changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "ui(loading): polish reveal motion and cashflow controls"
          git push origin HEAD:ui/loading-cashflow-polish
