name: Audit v1.4.36 performance and chart motion
on:
  push:
    branches: [audit/performance-v1-4-36]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/performance-v1-4-36
      - name: Inspect final optimization targets
        run: |
          echo '=== ACCOUNTING MONTH STATS ==='
          grep -n "calcMonthStatsBySale\|getSaleEventsInMonth\|getSaleEventsInRange" accounting.js app.js | head -160 || true
          n=$(grep -n "calcMonthStatsBySale" accounting.js | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-80)); [ $s -lt 1 ] && s=1; e=$((n+360)); sed -n "${s},${e}p" accounting.js; fi
          echo '=== SUMMARY CORE 13820-14220 ==='
          sed -n '13820,14230p' app.js
          echo '=== CHART CORE 13460-13675 ==='
          sed -n '13460,13680p' app.js
          echo '=== MONTH RENDER PICKER 14820-14960 ==='
          sed -n '14820,14980p' app.js
          echo '=== CLOUD REFRESH + CLOCK 4450-4650 ==='
          sed -n '4450,4650p' app.js
          echo '=== LATE REFRESH OVERRIDES ==='
          grep -n "_refreshCloudOnResume=.*function\|_refreshCloudOnResume=async\|var _.*BaseRefresh\|BaseRefreshCloud" app.js | head -80 || true
          echo '=== LOAD FUNCTION ==='
          grep -n "async function loadFromSupabase" app.js | head -10 || true
          echo '=== SUMMARY HELPERS ==='
          grep -n "function allItems\|allItems=\|function calcSummary\|calcSummaryGrossStats\|calcSummaryGrossDeltas" app.js accounting.js | head -120 || true
          echo '=== ACTIVE PAGE ==='
          sed -n '5255,5288p' app.js
