name: Validate real populated loading shell
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/loading-shell-v1420.yml'
      - '.github/scripts/apply_loading_shell_v1420.py'
permissions:
  contents: write
jobs:
  patch-and-visual-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.4.20
        run: python .github/scripts/apply_loading_shell_v1420.py
      - name: Static safety gate
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          js=Path('app.js').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          for token in [
            "var VERSION='1.4.13-2026-09-02'",
            'v1.4.15 stable return identity loaded',
            'v1.4.16 bulk platform editing loaded',
            'v1.4.17 terminal disposal durability loaded',
            'v1.4.18 polished real-layout loading loaded',
            'v1.4.19 Sales month-card loading loaded',
            'v1.4.20 populated real-layout loading shell loaded',
            'function _withRealLoadingSeed(renderFn)',
          ]: assert token in js, token
          assert '_withRealLoadingSeed(_bootRendererForTab(safe));' in js
          assert './app.js?v=1.4.20' in idx
          assert './app.css?v=1.4.20' in idx
          print('v1.4.20 static gate passed')
          PY
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Empty-DB responsive visual test
        run: |
          python -m http.server 4173 >/tmp/retrade-http.log 2>&1 &
          cat > /tmp/v1420-test.js <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[{n:'mobile',w:390,h:844},{n:'tablet',w:768,h:1024},{n:'desktop',w:1440,h:900}];
            const tabs=['summary','monthly','stock'];
            fs.mkdirSync('v1420-visuals',{recursive:true});
            for(const vp of cases){
              for(const tab of tabs){
                const p=await browser.newPage({viewport:{width:vp.w,height:vp.h}});
                await p.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
                await p.waitForFunction(()=>typeof window.showRealLayoutLoading==='function');
                await p.evaluate((tab)=>{
                  const auth=document.getElementById('auth-overlay');if(auth)auth.style.display='none';
                  const ol=document.getElementById('app-loading');if(ol)ol.remove();
                  document.body.classList.add('rt-app-visible');
                  // Production regression case: genuinely empty month data before cloud load.
                  if(typeof DB==='object'&&DB){
                    Object.keys(DB).forEach(k=>{if(/^[A-Z]{3}-\d{2}$/.test(k))delete DB[k];});
                    DB.expenses=[];DB.trips=[];DB.cashLedger=[];DB.sourcingRuns=[];
                  }
                  window.showRealLayoutLoading(tab,'Loading test');
                  let node=document.getElementById('p-'+tab);
                  while(node&&node!==document.body){
                    const cs=getComputedStyle(node);
                    if(cs.display==='none')node.style.display='block';
                    if(cs.visibility==='hidden')node.style.visibility='visible';
                    if(Number(cs.opacity)===0)node.style.opacity='1';
                    node=node.parentElement;
                  }
                },tab);
                await p.waitForTimeout(120);
                const s=await p.evaluate(()=>{
                  const page=document.querySelector('.page.on');
                  const txt=(page?.innerText||'');
                  const r=page?.getBoundingClientRect();
                  return {
                    onboarding:/Start your RETRADE workspace/i.test(txt),
                    busy:page?.getAttribute('aria-busy'),
                    masks:page?.querySelectorAll('.rt-data-loading').length||0,
                    chartMasks:page?.querySelectorAll('.rt-chart-loading,.rt-chart-data-loading').length||0,
                    listMasks:page?.querySelectorAll('.rt-loading-list-overlay').length||0,
                    disabled:page?.querySelectorAll('button:disabled,input:disabled,select:disabled').length||0,
                    fake:document.querySelectorAll('.rt-skel').length,
                    rect:r?{x:r.x,y:r.y,w:r.width,h:r.height}:null
                  };
                });
                if(s.onboarding)throw new Error(`${vp.n}/${tab}: onboarding leaked into loading shell`);
                if(s.busy!=='true'||s.masks<1||s.fake!==0||!s.rect||s.rect.w<300)throw new Error(`${vp.n}/${tab}: bad shell ${JSON.stringify(s)}`);
                if(tab==='stock'&&s.listMasks<1)throw new Error(`${vp.n}/stock: no real-list skeleton overlay`);
                if(tab==='summary'&&s.chartMasks<1)throw new Error(`${vp.n}/summary: no chart skeleton`);
                await p.screenshot({path:`v1420-visuals/${vp.n}-${tab}.png`,fullPage:true});
                await p.evaluate((tab)=>window.finishRealLayoutLoading(tab),tab);
                await p.waitForTimeout(450);
                const cleared=await p.evaluate(()=>({loading:document.body.classList.contains('rt-real-layout-loading'),masks:document.querySelectorAll('.rt-data-loading,.rt-loading-list-overlay,.rt-chart-loading,.rt-chart-data-loading').length}));
                if(cleared.loading||cleared.masks)throw new Error(`${vp.n}/${tab}: loader failed to clear ${JSON.stringify(cleared)}`);
                console.log(vp.n,tab,s);
                await p.close();
              }
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/v1420-test.js
      - uses: actions/upload-artifact@v4
        with:
          name: retrade-v1420-loading-visuals
          path: v1420-visuals/*.png
          retention-days: 7
      - name: Commit production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          git commit -m "fix(ui): render populated real loading shells"
          git push
