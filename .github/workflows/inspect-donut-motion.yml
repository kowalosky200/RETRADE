name: Inspect donut stroke motion
on:
  push:
    branches: [audit/return-profit-bounce]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/return-profit-bounce
      - run: |
          python - <<'PY'
          from pathlib import Path
          out=[]
          for fn,terms in [
            ('app.css',['donutSweep','donutClose','seg-len-o','dur-donut','cat-donut-draw']),
            ('app.js',['_animateDonut','donut-seg-last','seg-len-o','cat-donut-svg','cat-donut-draw'])
          ]:
            lines=Path(fn).read_text(encoding='utf-8').splitlines()
            hits=[]
            for i,l in enumerate(lines):
              if any(t in l for t in terms): hits.append(i)
            merged=[]
            for i in hits:
              a=max(0,i-25);b=min(len(lines),i+35)
              if merged and a<=merged[-1][1]+2: merged[-1]=(merged[-1][0],max(merged[-1][1],b))
              else: merged.append((a,b))
            out.append('===== '+fn+' =====')
            for a,b in merged:
              out.append(f'--- {a+1}-{b} ---')
              out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          Path('docs/donut-motion-context.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-donut-motion.yml
          git add docs/donut-motion-context.txt
          git commit -m "chore: capture donut motion context"
          git push origin HEAD:audit/return-profit-bounce
