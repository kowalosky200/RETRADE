name: Refund bars

on:
  push:
    branches:
      - refine/refund-bars

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refund bar patch
        run: python .github/refund_bars_patch.py

      - name: Validate
        run: |
          node --check app.js
          git diff --check
          grep -q "tertiaryBars:true" app.js
          grep -q "rt-chart-refund-bar" app.js
          grep -q "tertiaryColor:'var(--warn)'" app.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refine(dashboard): render refunds as subtle bars"
          git push origin HEAD:refine/refund-bars
