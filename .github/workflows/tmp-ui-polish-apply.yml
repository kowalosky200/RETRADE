name: TEMP apply UI responsiveness polish

on:
  push:
    branches:
      - ui/filter-motion-sales-loading-polish

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/filter-motion-sales-loading-polish

      - name: Apply targeted patch
        run: python .github/scripts/tmp_apply_ui_polish.py

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js

      - name: Verify UI performance and preservation contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')

          # Dashboard selector no longer blocks its change event with full render.
          assert 'function setSummaryPeriod(p){SUMMARY_PERIOD=p;renderSummary();_saveUIState();}' not in app
          assert 'let _summaryPeriodFrame=0;' in app
          assert '_summaryPeriodFrame2=requestAnimationFrame(function(){' in app

          # Saved subview state is restored before the skeleton renderer, not after cloud load.
          safe=app.index("const _safeTab = ['summary','monthly','stock','expenses','cash','returns','scrapped','tax','data','runs','activity'].includes(_lastTab) ? _lastTab : 'summary';")
          load=app.index('_loadUIState();', safe)
          skeleton=app.index("showRealLayoutLoading(_safeTab, 'Loading your data…');", safe)
          assert safe < load < skeleton
          shadow=app.index("try{ _initActivityShadow(); }catch(e){ console.warn('[RETRADE] shadow seed failed',e); }")
          render_comment=app.index('// Render the remembered destination into the already-mounted real page.', shadow)
          assert '_loadUIState();' not in app[shadow:render_comment]
          assert "function renderMonthlyPage(){\n  if(MONTHLY_VIEW==='grid')renderMonthlyGrid();\n  else renderMonth();\n}" in app

          # Fixed donut recoil and synchronized motion endpoint.
          assert 'const RECOIL=Math.min(26, g.len*0.6);' not in app
          assert 'const RECOIL=26;' in app
          assert 'const ringSlices=ranked.length>1?ranked.slice(1).concat(ranked[0]):ranked.slice();' in app
          assert '--dur-donut-sweep: 490ms;' in css
          assert '--dur-bounce: 350ms;' in css
          assert '--dur-draw: 840ms;' in css
          assert 'var(--dur-donut-sweep)' in css
          assert 'donutClose var(--dur-bounce) linear var(--dur-donut-sweep) forwards;' in css

          # Cashflow live filtering updates only its result surface.
          assert 'let _cashflowViewEvents=[];' in app
          assert 'function _updateCashflowResults(){' in app
          assert 'function _cashflowLedgerHTML(led,filtered){' in app
          filter_start=app.index('function setCashflowFilter(key,value){')
          filter_end=app.index('function cashflowSearchInput',filter_start)
          search_start=filter_end
          search_end=app.index('function clearCashflowFilters',search_start)
          clear_start=search_end
          clear_end=app.index('function _cashflowFileDate',clear_start)
          assert 'renderCash();' not in app[filter_start:filter_end]
          assert 'renderCash();' not in app[search_start:search_end]
          assert 'renderCash();' not in app[clear_start:clear_end]
          assert '_scheduleCashflowResultsUpdate(true);' in app[filter_start:filter_end]
          assert '_scheduleCashflowResultsUpdate(false);' in app[search_start:search_end]
          for needle in ('cashflow-result-count','cashflow-results','cashflow-filter-in','cashflow-filter-out','cashflow-filter-net','cashflow-clear-slot'):
              assert needle in app

          # Existing Cashflow/accounting UI and safe exports remain intact.
          assert app.count('function renderCash(){') == 1
          for needle in (
              'openReconcile()', 'addCashMove()', 'Business cash available',
              'Cash calculation audit', 'Still to be paid',
              "kpi('Cash tied up in stock'", "kpi('You took out'",
              'function exportCashflowExcel(){', 'function printCashflow(){',
              'function _cashflowCsvCell(value){', "if(/^[=+\\-@]/.test(s))",
              'const remaining=Math.max(0,440-elapsed);'
          ):
              assert needle in app, needle
          assert app.count('app.css?v=1.4.25') == 0  # cache refs belong in index only
          assert idx.count('app.css?v=1.4.25') == 1
          assert idx.count('app.js?v=1.4.25') == 1
          assert 'app.css?v=1.4.24' not in idx and 'app.js?v=1.4.24' not in idx
          print('UI performance/preservation contracts passed')
          PY

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/scripts/tmp_apply_ui_polish.py
          rm -f .github/workflows/tmp-ui-polish-apply.yml
          rm -f .github/workflows/tmp-ui-polish-trace.yml

      - name: Commit production files only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Final staged paths:"
          git diff --cached --name-only
          git commit -m "fix(ui): smooth filters and align loading motion"
          git push origin HEAD:ui/filter-motion-sales-loading-polish
