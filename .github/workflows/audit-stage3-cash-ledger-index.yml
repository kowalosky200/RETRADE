name: Stage 3 cash and ledger index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-cash-ledger-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mixed arrangement settlement audit
        shell: bash
        run: |
          echo '=== BULK SETTLE ROUTING 9310-9370 ==='
          sed -n '9310,9370p' app.js
          echo
          echo '=== BULK ACCOUNT ASSIGN 10480-10620 ==='
          sed -n '10480,10620p' app.js
          echo
          echo '=== ACCOUNT CORE CALL SITES ==='
          grep -n "_assignItemAccountCore" app.js || true
          echo
          echo '=== ITEM EDIT / COST MUTATIONS 20235-20420 ==='
          sed -n '20235,20420p' app.js
          echo
          echo '=== ACCOUNT TYPE CHANGE / SETTLEMENT KIND USE ==='
          grep -nEi "tx\.kind|kind:.*supplier|kind:.*consignment|accountType=.*acc-type|defaultSplitPercent" app.js accounting.js | head -n 260 || true
