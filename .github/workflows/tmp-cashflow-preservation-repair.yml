name: Temporary Cashflow preservation repair

on:
  push:
    branches:
      - ui/loading-cashflow-polish

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/loading-cashflow-polish

      - name: Correct duplicate cleanup assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/tmp_repair_cashflow_ui.py')
          s=p.read_text(encoding='utf-8')
          old="""def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              return text.replace(old, new, 1)
          """
          new="""def replace_once(text, old, new, label):
              count = text.count(old)
              expected = 2 if label == 'reduced-motion loading cleanup' else 1
              if count != expected:
                  raise SystemExit(f'{label}: expected exactly {expected} occurrence(s), found {count}')
              return text.replace(old, new, 1)
          """
          if old not in s:
              raise SystemExit('replace_once helper did not match expected repair script')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Apply preservation repair
        run: python .github/scripts/tmp_repair_cashflow_ui.py

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js

      - name: Verify preserved Cashflow and loading contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('app.css').read_text(encoding='utf-8')
          idx=Path('index.html').read_text(encoding='utf-8')
          assert app.count('function renderCash(){') == 1
          for needle in (
            'openReconcile()',
            'addCashMove()',
            'Business cash available',
            'Cash calculation audit',
            'Still to be paid',
            "kpi('You took out'",
            "kpi('Cash tied up in stock'",
            '_cashflowFilteredEvents(led)',
            'function exportCashflowExcel(){',
            'function printCashflow(){',
            'function _cashflowCsvCell(value){',
            "if(/^[=+\\-@]/.test(s))",
            "const remaining=Math.max(0,440-elapsed);",
            "const OVER=Math.min(RECOIL*0.30, g.rest*0.5);",
          ):
            assert needle in app, f'missing app contract: {needle}'
          assert app.count("const surfaceNodes=page.querySelectorAll('.rt-list-loading,.rt-panel-list-loading,.rt-age-loading,.rt-neutral-loading-bar,.rt-hide-while-loading');") == 1
          assert app.count("el.classList.remove('rt-list-loading','rt-panel-list-loading','rt-age-loading','rt-neutral-loading-bar','rt-hide-while-loading');") == 2
          for stale in ('c.currentBalance','c.openingBalance||0',"kpi('Money in',c.inflow"):
            assert stale not in app, f'stale replacement-model reference remains: {stale}'
          assert '--dur-bounce: 540ms;' in css
          assert '--dur-draw: 760ms;' in css
          assert 'rtHydratedReveal' in css
          assert idx.count('app.css?v=1.4.24') == 1
          assert idx.count('app.js?v=1.4.24') == 1
          print('Preservation and UI contracts passed')
          PY

      - name: Remove temporary repair machinery
        run: |
          rm -f .github/scripts/tmp_repair_cashflow_ui.py
          rm -f .github/workflows/tmp-cashflow-preservation-repair.yml

      - name: Commit corrected production files only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(ui): preserve cashflow controls in management polish"
          git push origin HEAD:ui/loading-cashflow-polish
