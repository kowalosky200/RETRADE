name: Stage 3 lifecycle code index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-lifecycle-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation bypass blocks
        shell: bash
        run: |
          echo '=== ACTIVITY UNDO 4015-4110 ==='
          sed -n '4015,4110p' app.js
          echo '=== BULK ACTIONS 15295-15525 ==='
          sed -n '15295,15525p' app.js
          echo '=== BUNDLE SALE 15995-16135 ==='
          sed -n '15995,16135p' app.js
          echo '=== DELETE SPLIT DUPLICATE 20585-20915 ==='
          sed -n '20585,20915p' app.js
          echo '=== SCRAP / RESTORE 17470-17580 ==='
          sed -n '17470,17580p' app.js
