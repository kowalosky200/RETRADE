name: TEMP apply theme hydration stability fix

on:
  push:
    branches: [fix/theme-hydration-stability]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/theme-hydration-stability
          fetch-depth: 0

      - name: Patch theme source-of-truth conflict
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Verify syntax and boot-theme contract
        shell: bash
        run: |
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          t=Path('app.js').read_text(encoding='utf-8')
          assert "localStorage.setItem(THEME_PREF_KEY,'system')" not in t
          assert "const localPref=(typeof _readThemePref==='function')?_readThemePref():null;" in t
          assert t.count("First use on this device: adopt the cloud's last resolved theme once.")==1
          print('Theme hydration stability contract passed')
          PY

      - name: Commit production change and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-theme-hydration-fix.yml
          git add app.js
          git commit -m "fix(ui): keep saved theme stable through cloud hydration"
          git push origin HEAD:fix/theme-hydration-stability
