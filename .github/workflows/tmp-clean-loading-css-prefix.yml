name: TEMP clean loading css prefix

on:
  push:
    branches: [fix/loading-motion-route-restore]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/loading-motion-route-restore
          fetch-depth: 0

      - name: Remove literal newline escapes before skeleton block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.css')
          t=p.read_text(encoding='utf-8')
          bad='\\n\\n/* v1.4.23 — dashboard donut real-layout skeleton */'
          good='\n\n/* v1.4.23 — dashboard donut real-layout skeleton */'
          if t.count(bad)!=1:
              raise SystemExit(f'Expected one escaped-prefix marker, found {t.count(bad)}')
          t=t.replace(bad,good,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Validate clean CSS prefix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('app.css').read_text(encoding='utf-8')
          assert '\\n\\n/* v1.4.23 — dashboard donut real-layout skeleton */' not in t
          assert t.count('/* v1.4.23 — dashboard donut real-layout skeleton */')==1
          print('CSS prefix clean')
          PY

      - name: Commit result and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-clean-loading-css-prefix.yml
          git add app.css
          git commit -m "chore(ui): clean loading skeleton css prefix"
          git push origin HEAD:fix/loading-motion-route-restore
