name: Stage 3 lifecycle code index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-lifecycle-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sale-cycle snapshot definitions
        shell: bash
        run: |
          grep -n "saleCycleSnapshot\|saleCycleNumbers" app.js | head -n 80 || true
          echo '=== RETURN BUNDLE SNAPSHOT FIELDS ==='
          grep -nEi "bundle.*AtReturn|_bundle|bundleId" app.js | grep -Ei "return|snapshot|relist" | head -n 160 || true
