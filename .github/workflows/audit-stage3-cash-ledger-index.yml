name: Stage 3 cash and ledger index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-cash-ledger-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settlement detail and routing
        shell: bash
        run: |
          echo '=== BULK SETTLE ROUTING + SUPPLIER OPEN 9320-9405 ==='
          sed -n '9320,9405p' app.js
          echo
          echo '=== SETTLEMENT DETAIL 9540-9610 ==='
          sed -n '9540,9610p' app.js
          echo
          echo '=== SETTLEMENT DETAIL CALLS ==='
          grep -n "_openSettlementDetail" app.js || true
          echo
          echo '=== ACCOUNT ITEM TYPE / DEBT HELPERS 9160-9265 ==='
          sed -n '9160,9265p' app.js
