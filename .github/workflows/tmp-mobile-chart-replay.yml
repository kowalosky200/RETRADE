name: TEMP mobile chart replay fix

on:
  push:
    branches:
      - ui/dashboard-motion-mobile

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dashboard-motion-mobile
          fetch-depth: 0
      - name: Apply deterministic mobile motion patch
        run: python .github/scripts/tmp_mobile_chart_replay_fix.py
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check accounting.js
          node --check reports.js
          node --check sw.js
      - name: Verify motion contracts
        run: |
          grep -F "rt-motion-hold" app.js
          grep -F "animationend',onEnd" app.js
          grep -F "v1.4.26 — deterministic dashboard motion replay" app.css
          grep -F "app.js?v=1.4.26" index.html
          grep -F "app.css?v=1.4.26" index.html
      - name: Commit production-only changes and self-remove
        run: |
          rm -f .github/scripts/tmp_mobile_chart_replay_fix.py .github/workflows/tmp-mobile-chart-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js app.css index.html .github/scripts/tmp_mobile_chart_replay_fix.py .github/workflows/tmp-mobile-chart-replay.yml
          git commit -m "fix(ui): start dashboard motion after skeleton reveal"
          git push origin HEAD:ui/dashboard-motion-mobile
