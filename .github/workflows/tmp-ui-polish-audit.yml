name: Temporary UI polish audit

on:
  push:
    branches:
      - ui/loading-cashflow-polish

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact UI hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename, needles in {
            'app.js':['function renderCash(){','function finishRealLayoutLoading','Math.max(0,260-elapsed)','function _animateDonut'],
            'app.css':['--dur-draw:460ms','--dur-bounce:360ms','@keyframes donutClose','body.rt-real-layout-loading .rt-data-loading'],
          }.items():
            lines=Path(filename).read_text(encoding='utf-8').splitlines()
            print(f'===== {filename} =====')
            for needle in needles:
              hits=[i for i,line in enumerate(lines) if needle in line]
              print(f'\n--- {needle!r}: {[i+1 for i in hits]} ---')
              for i in hits:
                lo=max(0,i-18); hi=min(len(lines),i+80)
                print(f'### {lo+1}-{hi}')
                for n in range(lo,hi): print(f'{n+1:06d}: {lines[n]}')
          PY
