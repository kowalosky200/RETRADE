name: run-dashboard-sales-returns-patch
on:
  push:
    branches:
      - fix/dashboard-sales-returns-series
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-sales-returns-series
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/dashboard-sales-returns-series.yml').read_text()
          marker="          python - <<'PY'\n"
          end="\n          PY\n"
          if marker not in src or end not in src:
              raise SystemExit('embedded patch script not found')
          body=src.split(marker,1)[1].split(end,1)[0]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          exec('\n'.join(lines),{'__name__':'__main__'})
          PY
          node --check app.js
          git diff --check
          grep -q "chartReturns" app.js
          grep -q "tertiaryLabel:'Refunds'" app.js
          grep -q "Sales &amp; returns over time" app.js
          git rm .github/workflows/dashboard-sales-returns-series.yml .github/workflows/run-dashboard-sales-returns-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "fix(dashboard): separate sales profit and refunds"
          git push origin HEAD:fix/dashboard-sales-returns-series
