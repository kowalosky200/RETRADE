name: Stage 2 extract Supabase contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract contract
        run: python .github/scripts/stage2_extract_supabase_contract.py
      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: stage2-supabase-contract
          path: stage2-supabase-contract.md
          retention-days: 14
