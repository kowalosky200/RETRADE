name: Stage 3 lifecycle code index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-lifecycle-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lifecycle transition blocks
        shell: bash
        run: |
          echo '=== LIFECYCLE CORE 20420-21720 ==='
          sed -n '20420,21720p' app.js
          echo
          echo '=== JOB LOT / BULK TRANSITIONS 15280-16220 ==='
          sed -n '15280,16220p' app.js
          echo
          echo '=== ACTIVITY / UNDO 3920-4125 ==='
          sed -n '3920,4125p' app.js
          echo
          echo '=== ACCOUNT / SETTLEMENT CORE 9040-9560 ==='
          sed -n '9040,9560p' app.js
