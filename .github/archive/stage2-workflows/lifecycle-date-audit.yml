name: Stage 2 disposal resurrection audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract disposal persistence and Stock filtering
        run: python .github/scripts/stage2_lifecycle_date_audit.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: stage2-disposal-resurrection-audit
          path: stage2-disposal-resurrection-audit.txt
          retention-days: 14
