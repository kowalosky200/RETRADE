name: Stage 3 cash and ledger index

on:
  push:
    branches:
      - audit/stage-3-data-integrity
    paths:
      - '.github/workflows/audit-stage3-cash-ledger-index.yml'

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify settlement patch anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('app.js').read_text(encoding='utf-8')
          a=Path('accounting.js').read_text(encoding='utf-8')
          patterns={
            'selected helper':(s,r"function _selectedAccountItems\(ids,accountId\)\{.*?\n\}",re.S),
            'bulk settle':(s,r"function _acctBulkSettle\(\)\{.*?\n\}\n\n// Grouped supplier settlement",re.S),
            'supplier open filter':(s,r"const picked=_selectedAccountItems\(ids,accountId\)\.filter\(function\(i\)\{\s*return _accountItemDebt\(i\)!==null\s*&&\s*!i\.accountSettled;\s*\}\);",re.S),
            'supplier confirm selected':(s,r"const selectedItems=_selectedAccountItems\(ids\|\|\[\],accountId\)\.filter\(function\(i\)\{\s*return _accountItemDebt\(i\)!==null\s*&&\s*!i\.accountSettled;\s*\}\);\s*const expected=\+selectedItems\.reduce\(function\(sum,i\)\{return sum\+\(_accountItemDebt\(i\)\|\|0\);\},0\)\.toFixed\(2\);",re.S),
            'supplier allocation loop':(s,r"if\(item&&_accountItemDebt\(item\)!==null&&!item\.accountSettled\)\{\s*allocations\.push\(\{id:item\.id,amount:\+\(\s*_accountItemDebt\(item\)\|\|0\)\.toFixed\(2\),name:item\.item\|\|''\}\);\s*item\.accountSettled=true;nSettled\+\+;\s*\}",re.S),
            'allocation helper return':(s,r"return \{id:i\.id,month:i\._month,amount:Math\.max\(0,amount\)\};",0),
            'consignment open filter':(s,r"const items=selected\.filter\(function\(i\)\{return _accountItemIsSold\(i\)&&i\.accountSettled!==true&&_accountItemDebt\(i\)!==null;\}\);",0),
            'consignment confirm items':(s,r"const items=_selectedAccountItems\(d\.itemIds,d\.accountId\)\.filter\(_accountItemIsSold\);\s*const allocations=_allocatePartnerTotal\(items,partner\);",re.S),
            'consignment tx':(s,r"const tx=\{id:_newId\('stl'\),date:date,createdAt:new Date\(\)\.toISOString\(\),paid:paid,partnerAmount:partner,yourAmount:_roundMoney\(d\.gross-partner\),grossProfit:d\.gross,suggestedPartner:d\.suggested,note:note\|\|null,items:allocations\};",0),
            'consignment all account filter':(s,r"if\(i\.accountId===accountId&&_accountItemIsSold\(i\)&&i\.accountSettled!==true&&_accountItemDebt\(i\)!==null\)ids\.push\(i\.id\);",0),
            'settlement detail':(s,r"function _openSettlementDetail\(accountId,settlementId\)\{.*?\n\}\n\n// Printable partner remittance slip",re.S),
            'bulk unsettle':(s,r"function _acctBulkUnsettle\(\)\{.*?\n\}\n\n// Bulk set cost",re.S),
            'settle all':(s,r"function settleAllForAccount\(accountId\)\{.*?\n\}\n\n// Per-item split editor",re.S),
            'toggle settled':(s,r"function toggleItemSettled\(month,itemId,ev\)\{.*?\n\}\n\n// ── Account create / edit",re.S),
            'supplier legacy migration':(s,r"// One-time migration: pre-existing supplier items with a cost and no explicit.*?function _migrateSupplierSettledOnce\(\)\{.*?\n\}\n",re.S),
            'preview migration call':(s,r"try\{ if\(typeof _migrateSupplierSettledOnce==='function'\)_migrateSupplierSettledOnce\(\); \}catch\(e\)\{ console\.warn\('supplier settle migrate \(preview\):',e\); \}",0),
            'main migration counter':(s,r"let _supplierMigrated=0,_saleNoMigrated=0,_cashAuditBackfilled=0;",0),
            'main migration call':(s,r"try\{if\(typeof _migrateSupplierSettledOnce==='function'\)_supplierMigrated=_migrateSupplierSettledOnce\(\)\|\|0;\}catch\(e\)\{console\.warn\('supplier settle migration failed',e\);\}",0),
            'main migration dirty':(s,r"if\(_reconciled>0\|\|_supplierMigrated>0\|\|_saleNoMigrated>0\|\|_cashAuditBackfilled>0\)\{",0),
            'accounting paid lookup':(a,r"const hit=\(tx\.items\|\|\[\]\)\.some\(function\(a\)\{return a&&a\.id===itemId;\}\);",0),
            'accounting tax kind':(a,r"const kind=tx\.kind\|\|acct\.accountType\|\|'supplier';\s*if\(kind!=='supplier'\)partnerPaid\+=Math\.max\(0,Number\(tx\.partnerAmount\)\|\|0\);",re.S),
          }
          bad=[]
          for name,(text,pat,flags) in patterns.items():
            n=len(re.findall(pat,text,flags))
            print(f'{name}: {n}')
            if n!=1: bad.append((name,n))
          if bad: raise SystemExit('anchor mismatch: '+repr(bad))
          print('All settlement patch anchors: PASS')
          PY
