name: Stage 2 bulk platform audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage2-lifecycle-date-audit.yml'
      - '.github/scripts/stage2_lifecycle_date_audit.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract bulk selection and platform paths
        run: python .github/scripts/stage2_lifecycle_date_audit.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage2-bulk-platform-audit.txt
          if git diff --cached --quiet; then
            echo "No audit report changes"
          else
            git commit -m "chore(audit): capture bulk platform handlers [skip ci]"
            git push
          fi
